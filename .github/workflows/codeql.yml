name: CodeQL

on:
  push:
    branches:
      - main
      - release/**
  pull_request:
    branches:
      - main
  schedule:
    - cron: '17 6 * * 0'
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  security-events: write

env:
  GOTOOLCHAIN: local

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
          - language: go
            build-mode: autobuild
          - language: python
            build-mode: none

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Go
        if: matrix.language == 'go'
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.7'
          check-latest: false
          cache: true

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Autobuild
        if: matrix.build-mode == 'autobuild'
        uses: github/codeql-action/autobuild@v4

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}

  aggregate:
    name: CodeQL Aggregate
    runs-on: ubuntu-latest
    if: ${{ always() }}
    needs: [analyze]

    steps:
      - name: Evaluate CodeQL jobs
        env:
          ANALYZE_RESULT: ${{ needs.analyze.result }}
        run: |
          if [ "${ANALYZE_RESULT}" != "success" ]; then
            echo "CodeQL analysis did not succeed: ${ANALYZE_RESULT}"
            exit 1
          fi
