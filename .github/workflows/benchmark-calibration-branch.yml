name: Phase 11 Branch Benchmark Calibration

on:
  push:
    branches:
      - release/v1.13.11
    paths:
      - .github/workflows/benchmark-calibration-branch.yml

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  CALIBRATION_MODE: calibration
  LAUNCHER_PATH: .github/workflows/benchmark-calibration-branch.yml
  COLDKEEP_AES_GCM_FIXTURE_HEX: ${{ format('{0}{1}{0}{1}{0}{1}{0}{1}', '01234567', '89abcdef') }}
  POSTGRES_IMAGE_DIGEST: sha256:33f923b05f64ca54ac4401c01126a6b92afe839a0aa0a52bc5aeb5cc958e5f20

concurrency:
  group: benchmark-calibration-branch-${{ github.ref }}-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  sample:
    name: sample (${{ matrix.compression }}, w${{ matrix.workers }}, r${{ matrix.replicate }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16@sha256:33f923b05f64ca54ac4401c01126a6b92afe839a0aa0a52bc5aeb5cc958e5f20
        env:
          POSTGRES_USER: coldkeep
          POSTGRES_PASSWORD: coldkeep
          POSTGRES_DB: coldkeep
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U coldkeep -d coldkeep"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    strategy:
      fail-fast: false
      matrix:
        compression: [none, zstd]
        workers: [1, 4]
        replicate: [1, 2]

    steps:
      - name: Checkout exact calibration source
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate calibration event and source
        id: preflight
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_REF: ${{ github.ref }}
          SOURCE_SHA: ${{ github.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          FORCED_PUSH: ${{ github.event.forced }}
        run: |
          set -euo pipefail
          printf 'sha12=%s\n' "${SOURCE_SHA:0:12}" >> "${GITHUB_OUTPUT}"

          test "${CALIBRATION_MODE}" = "calibration"
          test "${EVENT_NAME}" = "push"
          test "${EVENT_REF}" = "refs/heads/release/v1.13.11"
          test "${FORCED_PUSH}" = "false"
          [[ "${SOURCE_SHA}" =~ ^[0-9a-f]{40}$ ]]
          [[ "${BEFORE_SHA}" =~ ^[0-9a-f]{40}$ ]]
          test "${BEFORE_SHA}" != "0000000000000000000000000000000000000000"
          git cat-file -e "${BEFORE_SHA}^{commit}"
          git cat-file -e "${SOURCE_SHA}^{commit}"

          changed="$(git diff --name-status "${BEFORE_SHA}" "${SOURCE_SHA}")"
          expected_add=$(printf 'A\t%s' "${LAUNCHER_PATH}")
          expected_modify=$(printf 'M\t%s' "${LAUNCHER_PATH}")
          if [[ "${changed}" != "${expected_add}" && "${changed}" != "${expected_modify}" ]]; then
            echo "calibration push must add or modify only the temporary launcher" >&2
            exit 2
          fi

          git switch --force-create benchmark-calibration-source "${SOURCE_SHA}"
          test "$(git rev-parse HEAD)" = "${SOURCE_SHA}"
          test "$(git symbolic-ref --quiet --short HEAD)" = "benchmark-calibration-source"

      - name: Setup exact Go toolchain
        uses: actions/setup-go@v6
        with:
          go-version: '1.25.12'
          cache: true

      - name: Build benchmark binary once
        run: go build -o coldkeep ./cmd/coldkeep

      - name: Run fixed calibration samples
        env:
          SOURCE_SHA: ${{ github.sha }}
          COLDKEEP_DB_AUTO_BOOTSTRAP: true
          COLDKEEP_CODEC: aes-gcm
          COLDKEEP_COMPRESSION: ${{ matrix.compression }}
          COLDKEEP_KEY: ${{ env.COLDKEEP_AES_GCM_FIXTURE_HEX }}
          COLDKEEP_CONTAINER_LOCK_RETRY_ATTEMPTS: 12
          COLDKEEP_CONTAINER_LOCK_RETRY_BASE_WAIT_MS: 15
          COLDKEEP_CONTAINER_LOCK_RETRY_MAX_WAIT_MS: 900
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_USER: coldkeep
          DB_PASSWORD: coldkeep
          DB_NAME: coldkeep
          DB_SSLMODE: disable
        run: |
          set +e
          profile='${{ matrix.compression }}-w${{ matrix.workers }}-r${{ matrix.replicate }}'
          evidence_root="evidence/${profile}"
          mkdir -p "${evidence_root}"
          postgres_version="$(docker exec '${{ job.services.postgres.id }}' postgres --version)"

          python3 scripts/benchmark_gate.py sample \
            --binary ./coldkeep \
            --output-dir "${evidence_root}/sample" \
            --compression '${{ matrix.compression }}' \
            --workers '${{ matrix.workers }}' \
            --dataset ci-stable-v1 \
            --warmups 1 \
            --samples 10 \
            --source-commit "${SOURCE_SHA}" \
            --go-version "$(go version)" \
            --postgres-version "${postgres_version}" \
            --database-image-digest "${POSTGRES_IMAGE_DIGEST}" \
            >"${evidence_root}/sampler.stdout" \
            2>"${evidence_root}/sampler.stderr"
          sample_status=$?
          printf '%s\n' "${sample_status}" >"${evidence_root}/sampler-exit-status.txt"
          exit "${sample_status}"

      - name: Finalize sanitized sample evidence
        if: ${{ always() }}
        env:
          SOURCE_SHA: ${{ github.sha }}
          WORKFLOW_JOB_ID: ${{ job.check_run_id }}
          COMPRESSION: ${{ matrix.compression }}
          WORKERS: ${{ matrix.workers }}
          REPLICATE: ${{ matrix.replicate }}
        run: |
          python3 - <<'PY'
          import hashlib
          import importlib.util
          import json
          import os
          import pathlib
          import shutil

          compression = os.environ["COMPRESSION"]
          workers = int(os.environ["WORKERS"])
          replicate = int(os.environ["REPLICATE"])
          root = pathlib.Path("evidence") / f"{compression}-w{workers}-r{replicate}"
          root.mkdir(parents=True, exist_ok=True)
          aggregate_path = root / "sample" / "aggregate.json"
          validation_path = root / "fixture-io-validation.json"

          def write(path, value):
              path.write_text(json.dumps(value, indent=2, sort_keys=True, allow_nan=False) + "\n", encoding="utf-8")

          if not aggregate_path.is_file():
              write(validation_path, {"status": "failed", "reason": "aggregate.json is missing"})
              raise SystemExit("aggregate.json is missing")

          report = json.loads(aggregate_path.read_text(encoding="utf-8"))
          provenance = report.get("provenance", {})
          image_os = os.environ.get("ImageOS", "ubuntu24")
          image_version = os.environ.get("ImageVersion", "unavailable")
          provenance["source_commit"] = os.environ["SOURCE_SHA"]
          provenance["workflow_run_id"] = os.environ["GITHUB_RUN_ID"]
          provenance["workflow_job_id"] = os.environ["WORKFLOW_JOB_ID"]
          provenance["workflow_job_name"] = os.environ["GITHUB_JOB"]
          provenance["workflow_run_attempt"] = os.environ["GITHUB_RUN_ATTEMPT"]
          provenance["runner_image"] = f"{image_os}@{image_version}"
          report["provenance"] = provenance
          report["calibration_mode"] = os.environ["CALIBRATION_MODE"]
          aggregate_path.write_text(
              json.dumps(report, indent=2, sort_keys=True, allow_nan=False) + "\n",
              encoding="utf-8",
          )

          spec = importlib.util.spec_from_file_location("benchmark_gate", "scripts/benchmark_gate.py")
          gate = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(gate)
          gate.validate_aggregate(report, require_gate_count=False)
          if report["warmup_count"] != 1 or report["sample_count"] != 10:
              raise SystemExit("calibration requires one warmup and ten measured samples")
          if report["profile"] != {
              "codec": "aes-gcm",
              "compression": compression,
              "dataset": "ci-stable-v1",
              "workers": workers,
              "pipeline_depth": 1,
              "deterministic": True,
          }:
              raise SystemExit("aggregate profile does not match the matrix job")

          os_release = {}
          release_path = pathlib.Path("/etc/os-release")
          if release_path.is_file():
              for line in release_path.read_text(encoding="utf-8").splitlines():
                  if "=" not in line:
                      continue
                  key, value = line.split("=", 1)
                  if key in {"ID", "VERSION_ID", "PRETTY_NAME"}:
                      os_release[key.lower()] = value.strip().strip('"')

          disk = shutil.disk_usage(pathlib.Path.cwd())
          loads = os.getloadavg() if hasattr(os, "getloadavg") else (0.0, 0.0, 0.0)
          sanitized = {
              key: provenance[key]
              for key in (
                  "source_commit",
                  "generated_at_utc",
                  "workflow_run_id",
                  "workflow_job_id",
                  "workflow_job_name",
                  "workflow_run_attempt",
                  "runner_os",
                  "runner_image",
                  "runner_arch",
                  "cpu_count",
                  "go_version",
                  "postgres_version",
                  "database_image_digest",
                  "binary_sha256",
              )
          }
          sanitized.update({
              "calibration_mode": os.environ["CALIBRATION_MODE"],
              "runner_label": "ubuntu-24.04",
              "os_release": os_release,
              "free_disk_bytes": disk.free,
              "load_1m": loads[0],
              "load_5m": loads[1],
              "load_15m": loads[2],
          })
          write(root / "provenance.json", sanitized)
          write(validation_path, {
              "status": "ok",
              "schema_version": report["schema_version"],
              "fixture": report["fixture"],
              "profile": report["profile"],
              "warmup_count": report["warmup_count"],
              "sample_count": report["sample_count"],
              "cases": [
                  {
                      "case": case["case"],
                      "logical_files": case["logical_files"],
                      "logical_bytes": case["logical_bytes"],
                      "fixture_stats": case["fixture_stats"],
                  }
                  for case in report["cases"]
              ],
          })
          PY

      - name: Clean residual calibration resources
        if: ${{ always() }}
        env:
          COMPRESSION: ${{ matrix.compression }}
          WORKERS: ${{ matrix.workers }}
          REPLICATE: ${{ matrix.replicate }}
        run: |
          set +e
          profile="${COMPRESSION}-w${WORKERS}-r${REPLICATE}"
          evidence_root="evidence/${profile}"
          mkdir -p "${evidence_root}"
          container='${{ job.services.postgres.id }}'

          tmp_before=$(find /tmp -maxdepth 1 -type d -name 'coldkeep-benchmark-*' -print | wc -l)
          find /tmp -maxdepth 1 -type d -name 'coldkeep-benchmark-*' -exec rm -rf -- {} + >/dev/null 2>&1
          tmp_cleanup_status=$?
          tmp_after=$(find /tmp -maxdepth 1 -type d -name 'coldkeep-benchmark-*' -print | wc -l)

          db_before=$(docker exec "${container}" psql -U coldkeep -d postgres -Atqc \
            "SELECT count(*) FROM pg_database WHERE datname LIKE 'coldkeep_bench_%'" 2>/dev/null)
          db_query_status=$?
          db_cleanup_status=0
          if [[ "${db_query_status}" -eq 0 ]]; then
            while IFS= read -r database_name; do
              [[ -z "${database_name}" ]] && continue
              if [[ ! "${database_name}" =~ ^coldkeep_bench_[a-z0-9_]+$ ]]; then
                db_cleanup_status=1
                continue
              fi
              docker exec "${container}" psql -U coldkeep -d postgres -Atqc \
                "SELECT pg_terminate_backend(pid) FROM pg_stat_activity WHERE datname = '${database_name}' AND pid <> pg_backend_pid()" \
                >/dev/null 2>&1 || db_cleanup_status=1
              docker exec "${container}" psql -U coldkeep -d postgres -Atqc \
                "DROP DATABASE IF EXISTS \"${database_name}\"" \
                >/dev/null 2>&1 || db_cleanup_status=1
            done < <(docker exec "${container}" psql -U coldkeep -d postgres -Atqc \
              "SELECT datname FROM pg_database WHERE datname LIKE 'coldkeep_bench_%' ORDER BY datname" 2>/dev/null)
          else
            db_cleanup_status=1
            db_before=-1
          fi

          db_after=$(docker exec "${container}" psql -U coldkeep -d postgres -Atqc \
            "SELECT count(*) FROM pg_database WHERE datname LIKE 'coldkeep_bench_%'" 2>/dev/null)
          db_after_status=$?
          [[ "${db_after_status}" -eq 0 ]] || db_after=-1

          cleanup_status=0
          [[ "${tmp_cleanup_status}" -eq 0 && "${tmp_after}" -eq 0 ]] || cleanup_status=1
          [[ "${db_cleanup_status}" -eq 0 && "${db_after_status}" -eq 0 && "${db_after}" -eq 0 ]] || cleanup_status=1

          TMP_BEFORE="${tmp_before}" TMP_AFTER="${tmp_after}" \
          DB_BEFORE="${db_before}" DB_AFTER="${db_after}" \
          CLEANUP_STATUS="${cleanup_status}" python3 - <<'PY'
          import json
          import os
          import pathlib

          status = int(os.environ["CLEANUP_STATUS"])
          value = {
              "status": "ok" if status == 0 else "failed",
              "temporary_directory_count_before": int(os.environ["TMP_BEFORE"]),
              "temporary_directory_count_after": int(os.environ["TMP_AFTER"]),
              "temporary_database_count_before": int(os.environ["DB_BEFORE"]),
              "temporary_database_count_after": int(os.environ["DB_AFTER"]),
          }
          path = pathlib.Path("evidence") / (
              f"{os.environ['COMPRESSION']}-w{os.environ['WORKERS']}-r{os.environ['REPLICATE']}"
          ) / "cleanup-status.json"
          path.write_text(json.dumps(value, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          PY
          exit "${cleanup_status}"

      - name: Generate sample evidence checksums
        if: ${{ always() }}
        env:
          COMPRESSION: ${{ matrix.compression }}
          WORKERS: ${{ matrix.workers }}
          REPLICATE: ${{ matrix.replicate }}
        run: |
          set -euo pipefail
          evidence_root="evidence/${COMPRESSION}-w${WORKERS}-r${REPLICATE}"
          mkdir -p "${evidence_root}"
          cd "${evidence_root}"
          checksum_tmp=$(mktemp)
          find . -type f ! -name checksums.sha256 -print0 \
            | sort -z \
            | xargs -0 -r sha256sum > "${checksum_tmp}"
          mv "${checksum_tmp}" checksums.sha256

      - name: Upload immutable sample evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-calibration-${{ steps.preflight.outputs.sha12 }}-${{ matrix.compression }}-w${{ matrix.workers }}-r${{ matrix.replicate }}-a${{ github.run_attempt }}
          path: evidence/${{ matrix.compression }}-w${{ matrix.workers }}-r${{ matrix.replicate }}
          if-no-files-found: error

  calibration:
    name: calibration replica decision
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    needs: sample
    timeout-minutes: 10

    steps:
      - name: Checkout exact calibration harness
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate decision source
        id: identity
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          [[ "${SOURCE_SHA}" =~ ^[0-9a-f]{40}$ ]]
          printf 'sha12=%s\n' "${SOURCE_SHA:0:12}" >> "${GITHUB_OUTPUT}"
          git switch --force-create benchmark-calibration-source "${SOURCE_SHA}"
          test "$(git rev-parse HEAD)" = "${SOURCE_SHA}"
          test "$(git symbolic-ref --quiet --short HEAD)" = "benchmark-calibration-source"
          test "${CALIBRATION_MODE}" = "calibration"

      - name: Prepare decision evidence
        if: ${{ always() }}
        env:
          SOURCE_SHA: ${{ github.sha }}
          SAMPLE_RESULT: ${{ needs.sample.result }}
        run: |
          mkdir -p decision
          python3 - <<'PY'
          import json
          import os
          import pathlib

          pathlib.Path("decision/workflow-summary.json").write_text(
              json.dumps({
                  "status": "pending",
                  "calibration_mode": os.environ["CALIBRATION_MODE"],
                  "source_sha": os.environ["SOURCE_SHA"],
                  "workflow_run_id": os.environ["GITHUB_RUN_ID"],
                  "workflow_run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
                  "sample_matrix_result": os.environ["SAMPLE_RESULT"],
              }, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Download all sample evidence
        id: download
        if: ${{ always() }}
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          pattern: benchmark-calibration-*-a${{ github.run_attempt }}
          path: downloaded

      - name: Validate evidence and evaluate calibration
        if: ${{ always() }}
        env:
          SOURCE_SHA: ${{ github.sha }}
          SOURCE_SHA12: ${{ steps.identity.outputs.sha12 }}
          SAMPLE_RESULT: ${{ needs.sample.result }}
          DOWNLOAD_OUTCOME: ${{ steps.download.outcome }}
        run: |
          python3 - <<'PY'
          import hashlib
          import importlib.util
          import json
          import os
          import pathlib
          import subprocess

          source = os.environ["SOURCE_SHA"]
          sha12 = os.environ.get("SOURCE_SHA12") or source[:12]
          attempt = os.environ["GITHUB_RUN_ATTEMPT"]
          downloaded = pathlib.Path("downloaded")
          decision = pathlib.Path("decision")
          decision.mkdir(parents=True, exist_ok=True)
          errors = []
          inventory = []
          aggregate_args = []
          reports = []

          expected = {
              f"benchmark-calibration-{sha12}-{compression}-w{workers}-r{replicate}-a{attempt}":
                  (compression, workers, replicate)
              for compression in ("none", "zstd")
              for workers in (1, 4)
              for replicate in (1, 2)
          }
          observed = {path.name: path for path in downloaded.iterdir()} if downloaded.is_dir() else {}
          if set(observed) != set(expected):
              errors.append(
                  "artifact coverage mismatch: "
                  f"missing={sorted(set(expected) - set(observed))}, "
                  f"unexpected={sorted(set(observed) - set(expected))}"
              )

          spec = importlib.util.spec_from_file_location("benchmark_gate", "scripts/benchmark_gate.py")
          gate = importlib.util.module_from_spec(spec)
          try:
              spec.loader.exec_module(gate)
          except Exception as exc:
              errors.append(f"cannot load calibration harness: {exc}")

          for artifact_name, key in sorted(expected.items()):
              root = observed.get(artifact_name)
              if root is None:
                  continue
              compression, workers, replicate = key
              required = {
                  "checksums": root / "checksums.sha256",
                  "aggregate": root / "sample" / "aggregate.json",
                  "provenance": root / "provenance.json",
                  "validation": root / "fixture-io-validation.json",
                  "cleanup": root / "cleanup-status.json",
              }
              missing = [label for label, path in required.items() if not path.is_file()]
              if missing:
                  errors.append(f"{artifact_name}: missing required files {missing}")
                  continue

              checksum_entries = {}
              for line in required["checksums"].read_text(encoding="utf-8").splitlines():
                  if "  " not in line:
                      errors.append(f"{artifact_name}: malformed checksum line")
                      continue
                  digest, relative = line.split("  ", 1)
                  relative_path = pathlib.PurePosixPath(relative)
                  if relative_path.is_absolute() or ".." in relative_path.parts:
                      errors.append(f"{artifact_name}: unsafe checksum path")
                      continue
                  checksum_entries[relative] = digest
                  target = root / relative
                  if not target.is_file():
                      errors.append(f"{artifact_name}: checksum target is missing")
                      continue
                  actual = hashlib.sha256(target.read_bytes()).hexdigest()
                  if actual != digest:
                      errors.append(f"{artifact_name}: checksum mismatch for {relative}")
              expected_files = {
                  path.relative_to(root).as_posix()
                  for path in root.rglob("*")
                  if path.is_file() and path.name != "checksums.sha256"
              }
              normalized_entries = {value.removeprefix("./") for value in checksum_entries}
              if normalized_entries != expected_files:
                  errors.append(f"{artifact_name}: checksum coverage mismatch")

              try:
                  report = json.loads(required["aggregate"].read_text(encoding="utf-8"))
                  gate.validate_aggregate(report, require_gate_count=False)
                  if report.get("warmup_count") != 1 or report.get("sample_count") != 10:
                      raise ValueError("requires one warmup and ten samples")
                  if report.get("calibration_mode") != "calibration":
                      raise ValueError("calibration mode mismatch")
                  if report["provenance"].get("source_commit") != source:
                      raise ValueError("source SHA mismatch")
                  expected_profile = {
                      "codec": "aes-gcm",
                      "compression": compression,
                      "dataset": "ci-stable-v1",
                      "workers": workers,
                      "pipeline_depth": 1,
                      "deterministic": True,
                  }
                  if report.get("profile") != expected_profile:
                      raise ValueError("profile mismatch")
                  if json.loads(required["validation"].read_text(encoding="utf-8")).get("status") != "ok":
                      raise ValueError("fixture/I/O validation did not pass")
                  if json.loads(required["cleanup"].read_text(encoding="utf-8")).get("status") != "ok":
                      raise ValueError("cleanup did not pass")
              except Exception as exc:
                  errors.append(f"{artifact_name}: aggregate validation failed: {exc}")
                  continue

              label = f"{compression}-w{workers}-r{replicate}"
              aggregate_args.extend(("--aggregate", f"{label}={required['aggregate']}"))
              reports.append((label, report))
              inventory.append({
                  "artifact": artifact_name,
                  "profile": label,
                  "aggregate_sha256": hashlib.sha256(required["aggregate"].read_bytes()).hexdigest(),
                  "workflow_job_id": report["provenance"]["workflow_job_id"],
              })

          if len(reports) == 8:
              provenance_fields = tuple(gate.HARD_ENV_FIELDS) + ("runner_image", "binary_sha256")
              reference = reports[0][1]["provenance"]
              for label, report in reports[1:]:
                  for field in provenance_fields:
                      if report["provenance"].get(field) != reference.get(field):
                          errors.append(f"{label}: inconsistent environment provenance for {field}")
              job_ids = [str(report["provenance"]["workflow_job_id"]) for _, report in reports]
              if len(set(job_ids)) != 8:
                  errors.append("matrix workflow job IDs are not unique")

          if os.environ.get("DOWNLOAD_OUTCOME") != "success":
              errors.append(f"artifact download outcome is {os.environ.get('DOWNLOAD_OUTCOME')}")
          if os.environ.get("SAMPLE_RESULT") != "success":
              errors.append(f"sample matrix result is {os.environ.get('SAMPLE_RESULT')}")

          calibration_path = decision / "calibration-report.json"
          calibration_exit = None
          if not errors and len(reports) == 8:
              completed = subprocess.run(
                  [
                      "python3",
                      "scripts/benchmark_gate.py",
                      "calibrate",
                      *aggregate_args,
                      "--thresholds",
                      "benchmarks/v1.9/regression-thresholds.yaml",
                      "--output",
                      str(calibration_path),
                  ],
                  check=False,
              )
              calibration_exit = completed.returncode
              if completed.returncode != 0:
                  errors.append(f"calibration evaluator exited {completed.returncode}")
              if calibration_path.is_file():
                  calibration = json.loads(calibration_path.read_text(encoding="utf-8"))
                  calibration["source_sha"] = source
                  calibration["workflow_run_id"] = os.environ["GITHUB_RUN_ID"]
                  calibration["workflow_run_attempt"] = attempt
                  calibration_path.write_text(
                      json.dumps(calibration, indent=2, sort_keys=True, allow_nan=False) + "\n",
                      encoding="utf-8",
                  )
              else:
                  errors.append("calibration evaluator did not produce its report")

          (decision / "artifact-inventory.json").write_text(
              json.dumps(inventory, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          summary = {
              "status": "ok" if not errors else "failed",
              "calibration_mode": os.environ["CALIBRATION_MODE"],
              "source_sha": source,
              "workflow_run_id": os.environ["GITHUB_RUN_ID"],
              "workflow_run_attempt": attempt,
              "sample_matrix_result": os.environ.get("SAMPLE_RESULT"),
              "artifact_download_outcome": os.environ.get("DOWNLOAD_OUTCOME"),
              "expected_artifact_count": 8,
              "validated_artifact_count": len(reports),
              "calibration_exit_status": calibration_exit,
              "errors": errors,
          }
          (decision / "workflow-summary.json").write_text(
              json.dumps(summary, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          raise SystemExit(0 if not errors else 1)
          PY

      - name: Generate decision checksums
        if: ${{ always() }}
        run: |
          set -euo pipefail
          mkdir -p decision
          cd decision
          checksum_tmp=$(mktemp)
          find . -type f ! -name checksums.sha256 -print0 \
            | sort -z \
            | xargs -0 -r sha256sum > "${checksum_tmp}"
          mv "${checksum_tmp}" checksums.sha256

      - name: Upload calibration decision
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-calibration-${{ steps.identity.outputs.sha12 }}-decision-a${{ github.run_attempt }}
          path: decision
          if-no-files-found: error
