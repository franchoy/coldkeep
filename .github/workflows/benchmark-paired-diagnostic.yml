name: Phase 11 Paired Benchmark Qualification

on:
  push:
    branches:
      - release/v1.13.11
    paths:
      - .github/workflows/benchmark-paired-diagnostic.yml

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  POSTGRES_IMAGE_DIGEST: sha256:33f923b05f64ca54ac4401c01126a6b92afe839a0aa0a52bc5aeb5cc958e5f20
  COLDKEEP_AES_GCM_FIXTURE_HEX: ${{ format('{0}{1}{0}{1}{0}{1}{0}{1}', '01234567', '89abcdef') }}

concurrency:
  group: phase11-paired-qualification-${{ github.ref }}-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  sample:
    name: sample (${{ matrix.profile }})
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16@sha256:33f923b05f64ca54ac4401c01126a6b92afe839a0aa0a52bc5aeb5cc958e5f20
        env:
          POSTGRES_USER: coldkeep
          POSTGRES_PASSWORD: coldkeep
          POSTGRES_DB: coldkeep
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U coldkeep -d coldkeep"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: none-w1
            compression: none
            workers: 1
            dataset: ci-paired-w1-v1
          - profile: none-w4
            compression: none
            workers: 4
            dataset: ci-paired-w4-v1
          - profile: zstd-w1
            compression: zstd
            workers: 1
            dataset: ci-paired-w1-v1
          - profile: zstd-w4
            compression: zstd
            workers: 4
            dataset: ci-paired-w4-v1

    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          path: candidate
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout exact reference
        uses: actions/checkout@v6
        with:
          ref: 4ce5bfa76ca70908cd76bf20d8de28945e5dbae0
          path: reference
          fetch-depth: 0
          persist-credentials: false

      - name: Validate diagnostic event and source
        id: preflight
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_REF: ${{ github.ref }}
          FORCED_PUSH: ${{ github.event.forced }}
          CANDIDATE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          reference_sha='4ce5bfa76ca70908cd76bf20d8de28945e5dbae0'
          launcher_path='.github/workflows/benchmark-paired-diagnostic.yml'

          test "${EVENT_NAME}" = 'push'
          test "${EVENT_REF}" = 'refs/heads/release/v1.13.11'
          test "${FORCED_PUSH}" = 'false'
          [[ "${CANDIDATE_SHA}" =~ ^[0-9a-f]{40}$ ]]
          test "$(git -C candidate rev-parse HEAD)" = "${CANDIDATE_SHA}"
          test "$(git -C candidate rev-parse HEAD^)" = "${reference_sha}"
          test "$(git -C reference rev-parse HEAD)" = "${reference_sha}"

          changed="$(git -C candidate diff --name-status "${reference_sha}" "${CANDIDATE_SHA}")"
          expected="$(printf 'A\t%s' "${launcher_path}")"
          if [[ "${changed}" != "${expected}" ]]; then
            echo 'candidate must add only the paired diagnostic launcher' >&2
            exit 2
          fi

          printf 'candidate12=%s\n' "${CANDIDATE_SHA:0:12}" >> "${GITHUB_OUTPUT}"
          printf 'reference12=%s\n' "${reference_sha:0:12}" >> "${GITHUB_OUTPUT}"

      - name: Setup exact Go toolchain
        uses: actions/setup-go@v6
        with:
          go-version: '1.25.12'
          cache: true
          cache-dependency-path: |
            candidate/go.sum
            reference/go.sum

      - name: Build byte-identical binaries
        env:
          CGO_ENABLED: 0
          GOOS: linux
          GOARCH: amd64
        run: |
          set -euo pipefail
          build_root="${RUNNER_TEMP}/paired-build"
          mkdir -p "${build_root}"
          (
            cd reference
            go build -trimpath -buildvcs=false -o "${build_root}/reference-coldkeep" ./cmd/coldkeep
          )
          (
            cd candidate
            go build -trimpath -buildvcs=false -o "${build_root}/candidate-coldkeep" ./cmd/coldkeep
          )

      - name: Run fixed diagnostic profile
        env:
          COLDKEEP_DB_AUTO_BOOTSTRAP: true
          COLDKEEP_CODEC: aes-gcm
          COLDKEEP_KEY: ${{ env.COLDKEEP_AES_GCM_FIXTURE_HEX }}
          COLDKEEP_CONTAINER_LOCK_RETRY_ATTEMPTS: 12
          COLDKEEP_CONTAINER_LOCK_RETRY_BASE_WAIT_MS: 15
          COLDKEEP_CONTAINER_LOCK_RETRY_MAX_WAIT_MS: 900
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_USER: coldkeep
          DB_PASSWORD: coldkeep
          DB_NAME: coldkeep
          DB_SSLMODE: disable
        run: |
          set -euo pipefail
          postgres_version="$(docker exec "${{ job.services.postgres.id }}" postgres --version)"
          python3 candidate/scripts/paired_benchmark_gate.py sample \
            --reference-binary "${RUNNER_TEMP}/paired-build/reference-coldkeep" \
            --candidate-binary "${RUNNER_TEMP}/paired-build/candidate-coldkeep" \
            --reference-sha 4ce5bfa76ca70908cd76bf20d8de28945e5dbae0 \
            --candidate-sha "${{ github.sha }}" \
            --output-dir "${RUNNER_TEMP}/paired-${{ matrix.profile }}" \
            --dataset "${{ matrix.dataset }}" \
            --compression "${{ matrix.compression }}" \
            --workers "${{ matrix.workers }}" \
            --mode diagnostic \
            --pairs 10 \
            --command-timeout-seconds 600 \
            --go-version "$(go version)" \
            --postgres-version "${postgres_version}" \
            --database-image-digest "${POSTGRES_IMAGE_DIGEST}"

      - name: Record sanitized profile provenance
        if: ${{ always() }}
        env:
          CANDIDATE_SHA: ${{ github.sha }}
          WORKFLOW_JOB_ID: ${{ job.check_run_id }}
        run: |
          set +e
          reference_binary="${RUNNER_TEMP}/paired-build/reference-coldkeep"
          candidate_binary="${RUNNER_TEMP}/paired-build/candidate-coldkeep"
          reference_hash='unavailable'
          candidate_hash='unavailable'
          [[ -f "${reference_binary}" ]] && reference_hash="$(sha256sum "${reference_binary}" | awk '{print $1}')"
          [[ -f "${candidate_binary}" ]] && candidate_hash="$(sha256sum "${candidate_binary}" | awk '{print $1}')"
          postgres_version="$(docker exec "${{ job.services.postgres.id }}" postgres --version 2>/dev/null || printf unavailable)"
          free_disk_kib="$(df -Pk . | awk 'NR == 2 {print $4}')"
          host_load="$(cut -d ' ' -f 1-3 /proc/loadavg 2>/dev/null || printf unavailable)"
          {
            echo '### Sanitized paired-profile provenance'
            printf -- '- profile: %s\n' "${{ matrix.profile }}"
            printf -- '- runner: ubuntu-24.04 (%s@%s)\n' "${ImageOS:-unknown}" "${ImageVersion:-unknown}"
            printf -- '- OS/architecture: %s/%s\n' "${RUNNER_OS:-unknown}" "${RUNNER_ARCH:-unknown}"
            printf -- '- CPU count: %s\n' "$(getconf _NPROCESSORS_ONLN 2>/dev/null || printf unavailable)"
            printf -- '- Go: %s\n' "$(go version 2>/dev/null || printf unavailable)"
            printf -- '- PostgreSQL: %s\n' "${postgres_version}"
            printf -- '- database image digest: %s\n' "${POSTGRES_IMAGE_DIGEST}"
            printf -- '- reference SHA: %s\n' '4ce5bfa76ca70908cd76bf20d8de28945e5dbae0'
            printf -- '- candidate SHA: %s\n' "${CANDIDATE_SHA}"
            printf -- '- reference binary SHA-256: %s\n' "${reference_hash}"
            printf -- '- candidate binary SHA-256: %s\n' "${candidate_hash}"
            printf -- '- workflow run/job/attempt: %s/%s/%s\n' "${GITHUB_RUN_ID}" "${WORKFLOW_JOB_ID}" "${GITHUB_RUN_ATTEMPT}"
            printf -- '- free disk: %s KiB\n' "${free_disk_kib}"
            printf -- '- host load: %s\n' "${host_load}"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload immutable profile evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-paired-${{ steps.preflight.outputs.candidate12 }}-against-${{ steps.preflight.outputs.reference12 }}-${{ matrix.compression }}-w${{ matrix.workers }}-a${{ github.run_attempt }}
          path: ${{ runner.temp }}/paired-${{ matrix.profile }}
          if-no-files-found: error

  decision:
    name: decision
    needs: sample
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          path: candidate
          fetch-depth: 0
          persist-credentials: false

      - name: Validate decision source
        id: preflight
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_REF: ${{ github.ref }}
          FORCED_PUSH: ${{ github.event.forced }}
          CANDIDATE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          reference_sha='4ce5bfa76ca70908cd76bf20d8de28945e5dbae0'
          test "${EVENT_NAME}" = 'push'
          test "${EVENT_REF}" = 'refs/heads/release/v1.13.11'
          test "${FORCED_PUSH}" = 'false'
          [[ "${CANDIDATE_SHA}" =~ ^[0-9a-f]{40}$ ]]
          test "$(git -C candidate rev-parse HEAD)" = "${CANDIDATE_SHA}"
          test "$(git -C candidate rev-parse HEAD^)" = "${reference_sha}"
          printf 'candidate12=%s\n' "${CANDIDATE_SHA:0:12}" >> "${GITHUB_OUTPUT}"
          printf 'reference12=%s\n' "${reference_sha:0:12}" >> "${GITHUB_OUTPUT}"

      - name: Download none-w1 evidence
        uses: actions/download-artifact@v8
        with:
          name: benchmark-paired-${{ steps.preflight.outputs.candidate12 }}-against-${{ steps.preflight.outputs.reference12 }}-none-w1-a${{ github.run_attempt }}
          path: downloaded/none-w1

      - name: Download none-w4 evidence
        uses: actions/download-artifact@v8
        with:
          name: benchmark-paired-${{ steps.preflight.outputs.candidate12 }}-against-${{ steps.preflight.outputs.reference12 }}-none-w4-a${{ github.run_attempt }}
          path: downloaded/none-w4

      - name: Download zstd-w1 evidence
        uses: actions/download-artifact@v8
        with:
          name: benchmark-paired-${{ steps.preflight.outputs.candidate12 }}-against-${{ steps.preflight.outputs.reference12 }}-zstd-w1-a${{ github.run_attempt }}
          path: downloaded/zstd-w1

      - name: Download zstd-w4 evidence
        uses: actions/download-artifact@v8
        with:
          name: benchmark-paired-${{ steps.preflight.outputs.candidate12 }}-against-${{ steps.preflight.outputs.reference12 }}-zstd-w4-a${{ github.run_attempt }}
          path: downloaded/zstd-w4

      - name: Evaluate diagnostic qualification
        run: |
          set -euo pipefail
          python3 candidate/scripts/paired_benchmark_gate.py decision \
            --mode diagnostic \
            --profile none-w1=downloaded/none-w1 \
            --profile none-w4=downloaded/none-w4 \
            --profile zstd-w1=downloaded/zstd-w1 \
            --profile zstd-w4=downloaded/zstd-w4 \
            --output-dir "${RUNNER_TEMP}/paired-decision"

      - name: Record diagnostic-only decision
        if: ${{ always() }}
        run: |
          set +e
          report="${RUNNER_TEMP}/paired-decision/paired-decision.json"
          if [[ -f "${report}" ]]; then
            REPORT="${report}" python3 - <<'PY' >> "${GITHUB_STEP_SUMMARY}"
          import json
          import os

          with open(os.environ["REPORT"], encoding="utf-8") as source:
              report = json.load(source)
          print("### Paired diagnostic decision")
          print(f"- classification: `{report['classification']}`")
          print(f"- decision scope: `{report['decision_scope']}`")
          print(f"- authority: `{report['authority']}`")
          print(f"- production authority: `{str(report['production_authority']).lower()}`")
          PY
          fi

      - name: Upload immutable decision evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-paired-${{ steps.preflight.outputs.candidate12 }}-against-${{ steps.preflight.outputs.reference12 }}-decision-a${{ github.run_attempt }}
          path: ${{ runner.temp }}/paired-decision
          if-no-files-found: error
