        run: PATH="$PWD:$PATH" bash scripts/smoke.sh

      - name: Upload smoke artifacts on failure
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: smoke-artifacts-${{ matrix.codec }}
          path: ${{ github.workspace }}/.ci-storage/${{ matrix.codec }}
          if-no-files-found: ignore

  benchmark-integrity:
    name: Benchmark integrity (${{ matrix.profile }})
    runs-on: ubuntu-24.04
    needs: quality
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16@sha256:33f923b05f64ca54ac4401c01126a6b92afe839a0aa0a52bc5aeb5cc958e5f20
        env:
          POSTGRES_USER: coldkeep
          POSTGRES_PASSWORD: coldkeep
          POSTGRES_DB: coldkeep
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U coldkeep -d coldkeep"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: none-w1
            compression: none
            workers: 1
            dataset: ci-paired-w1-v2
          - profile: none-w4
            compression: none
            workers: 4
            dataset: ci-paired-w4-v2
          - profile: zstd-w1
            compression: zstd
            workers: 1
            dataset: ci-paired-w1-v2
          - profile: zstd-w4
            compression: zstd
            workers: 4
            dataset: ci-paired-w4-v2

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.7'
          check-latest: false
          cache: true

      - name: Build CLI
        run: go build -trimpath -buildvcs=false -o coldkeep ./cmd/coldkeep

      - name: Run hard benchmark integrity validation
        env:
          COLDKEEP_DB_AUTO_BOOTSTRAP: true
          COLDKEEP_CODEC: aes-gcm
          COLDKEEP_COMPRESSION: ${{ matrix.compression }}
          COLDKEEP_KEY: ${{ env.COLDKEEP_AES_GCM_FIXTURE_HEX }}
          COLDKEEP_CONTAINER_LOCK_RETRY_ATTEMPTS: 12
          COLDKEEP_CONTAINER_LOCK_RETRY_BASE_WAIT_MS: 15
          COLDKEEP_CONTAINER_LOCK_RETRY_MAX_WAIT_MS: 900
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_USER: coldkeep
          DB_PASSWORD: coldkeep
          DB_NAME: coldkeep
          DB_SSLMODE: disable
        run: |
          output_parent="benchmark-integrity-evidence/${{ matrix.profile }}"
          output_child="${output_parent}/integrity"
          mkdir -p "${output_parent}"
          test ! -e "${output_child}"
          python3 scripts/benchmark_gate.py integrity \
            --binary ./coldkeep \
            --output-dir "${output_child}" \
            --compression "${{ matrix.compression }}" \
            --workers "${{ matrix.workers }}" \
            --dataset "${{ matrix.dataset }}" \
            --command-timeout-seconds 600 \
            --source-commit "${GITHUB_SHA}" \
            --go-version "$(go version)" \
            --postgres-version "$(psql --version)" \
            --database-image-digest "sha256:33f923b05f64ca54ac4401c01126a6b92afe839a0aa0a52bc5aeb5cc958e5f20"

      - name: Verify integrity artifact checksums
        if: ${{ always() }}
        run: |
          cd "benchmark-integrity-evidence/${{ matrix.profile }}/integrity"
          sha256sum --check checksums.sha256

      - name: Upload benchmark integrity evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-integrity-${{ matrix.profile }}
          path: benchmark-integrity-evidence/${{ matrix.profile }}/integrity
          if-no-files-found: error

  benchmark-timing-advisory:
    name: Benchmark timing advisory (${{ matrix.profile }})
    runs-on: ubuntu-24.04
    needs: quality
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16@sha256:33f923b05f64ca54ac4401c01126a6b92afe839a0aa0a52bc5aeb5cc958e5f20
        env:
          POSTGRES_USER: coldkeep
          POSTGRES_PASSWORD: coldkeep
          POSTGRES_DB: coldkeep
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U coldkeep -d coldkeep"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: none-w1
            compression: none
            workers: 1
            mode: uncompressed
            baseline: benchmark-baseline-v1.9-packed-aes-gcm-none-small-w1-r1.json
          - profile: none-w4
            compression: none
            workers: 4
            mode: uncompressed
            baseline: benchmark-baseline-v1.9-packed-aes-gcm-none-small-w4-r1.json
          - profile: zstd-w1
            compression: zstd
            workers: 1
            mode: compressed
            baseline: benchmark-baseline-v1.9-packed-aes-gcm-zstd-small-w1-r1.json
          - profile: zstd-w4
            compression: zstd
            workers: 4
            mode: compressed
            baseline: benchmark-baseline-v1.9-packed-aes-gcm-zstd-small-w4-r1.json

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.7'
          check-latest: false
          cache: true

      - name: Build CLI
        run: go build -trimpath -buildvcs=false -o coldkeep ./cmd/coldkeep

      - name: Run historical timing observation
        env:
          COLDKEEP_DB_AUTO_BOOTSTRAP: true
          COLDKEEP_CODEC: aes-gcm
          COLDKEEP_COMPRESSION: ${{ matrix.compression }}
          COLDKEEP_KEY: ${{ env.COLDKEEP_AES_GCM_FIXTURE_HEX }}
          COLDKEEP_CONTAINER_LOCK_RETRY_ATTEMPTS: 12
          COLDKEEP_CONTAINER_LOCK_RETRY_BASE_WAIT_MS: 15
          COLDKEEP_CONTAINER_LOCK_RETRY_MAX_WAIT_MS: 900
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_USER: coldkeep
          DB_PASSWORD: coldkeep
          DB_NAME: coldkeep
          DB_SSLMODE: disable
        run: |
          mkdir -p "benchmark-timing-evidence/${{ matrix.profile }}"
          ./coldkeep benchmark run \
            --dataset small \
            --workers "${{ matrix.workers }}" \
            --repeat 1 \
            --output json \
            | tee "benchmark-timing-evidence/${{ matrix.profile }}/benchmark.json"

      - name: Evaluate and verify timing advisory
        run: |
          evidence_dir="benchmark-timing-evidence/${{ matrix.profile }}"
          report="${evidence_dir}/timing-advisory.json"
          set +e
          python3 scripts/validate_regression_thresholds.py check \
            "${evidence_dir}/benchmark.json" \
            --baseline "benchmarks/v1.9/baselines/${{ matrix.baseline }}" \
            --mode "${{ matrix.mode }}" \
            --policy hosted-advisory \
            --json-report "${report}"
          comparator_exit=$?
          set -e
          [[ -s "${report}" ]]
          python3 scripts/validate_regression_thresholds.py verify-advisory-exit \
            --report "${report}" \
            --observed-exit-code "${comparator_exit}"
          classification="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["classification"])' "${report}")"
          violations="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["violations_count"])' "${report}")"
          {
            echo "### Benchmark timing advisory: ${{ matrix.profile }}"
            echo
            echo "Classification: \`${classification}\`"
            echo
            echo "Historical threshold crossings: ${violations}"
          } >> "${GITHUB_STEP_SUMMARY}"
          cd "${evidence_dir}"
          actual_inventory="$(find . -maxdepth 1 -type f ! -name checksums.sha256 -printf '%f\n' | sort)"
          [[ "${actual_inventory}" == $'benchmark.json\ntiming-advisory.json' ]]
          sha256sum benchmark.json timing-advisory.json > checksums.sha256
          sha256sum --check checksums.sha256
          case "${comparator_exit}" in
            0|10|11|12)
              exit 0
              ;;
            2)
              exit 2
              ;;
            *)
              echo "unexpected benchmark timing advisory exit: ${comparator_exit}" >&2
              exit 2
              ;;
          esac

      - name: Upload benchmark timing advisory evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-timing-advisory-${{ matrix.profile }}
          path: benchmark-timing-evidence/${{ matrix.profile }}
          if-no-files-found: error

  critical-coverage-report:
    name: critical coverage report
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.7'
          check-latest: false
          cache: true

      - name: Generate critical coverage report
        run: |
          scripts/critical_coverage.sh --report --csv-output docs/release/v1.10/v1.10.7-ci-coverage-report.csv

      - name: Upload critical coverage report
        uses: actions/upload-artifact@v7
        with:
          name: v1.10.7-critical-coverage-report
          path: docs/release/v1.10/v1.10.7-ci-coverage-report.csv

  cross-platform:
    name: Cross-platform validation (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.7'
          check-latest: false
          cache: true

      - name: Show Go environment
        run: go env

      - name: Run native coordination runtime tests
        run: go test -v -count=1 -run '^(TestNativeLock|TestWindowsNativeLock|TestProductionCoordinator)' ./internal/coordination

      - name: Run Windows secure-rename boundary tests
        if: runner.os == 'Windows'
        run: go test -v -count=1 -run '^TestWindowsRenameBuffer' ./internal/fsx/secureinstall

      - name: Run path safety cross-platform tests
        run: go test ./internal/pathsafe/... -run 'TrustedRoot|Symlink|Alias|WritePath' -count=1

      - name: Run storage restore cross-platform tests
        run: go test ./internal/storage/... -run 'TestRestore(FileByStoredPath(UsesPhysicalPathIdentity|UsesLexicalPhysicalPathIdentityAboveAlias|PrefixMode|PrefixModeCreatesMissingParents|OverrideMode|RejectsSymlinkedPrefixRoot)|WithTrustedRootAllowsOuterAliasForExactOutputPath|StoredPath(PrefixAllowsOuterAliasAboveTrustedRoot|OverrideAllowsOuterAliasAboveDerivedRoot|PrefixRejectsSymlinkedTargetInTrustedRoot|OverrideRejectsSymlinkedTargetInTrustedRoot|OriginalRejectsInjectedSymlinkBelowDerivedTrustedRoot)|RejectsSymlinkedTargetInTrustedRoot)' -count=1

      - name: Run engine restore cross-platform tests
        run: go test ./internal/engine/... -run '^TestRestore' -count=1

      - name: Run snapshot restore cross-platform tests
        run: go test ./internal/snapshot/... -run '^TestRestoreSnapshot' -count=1

  vulnerability:
    name: Reachable vulnerability scan (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.7'
          check-latest: false
          cache: true

      - name: Run blocking reachable-vulnerability scan
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...

  source-install:
    name: Local source installation (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout clean source
        uses: actions/checkout@v6
        with:
          clean: true

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.7'
          check-latest: false
          cache: true

      - name: Build and install from local source (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(go env GOVERSION)" = "go1.26.7"
          test "$(go env GOTOOLCHAIN)" = "local"
          cc --version
          CGO_ENABLED=1 go build ./cmd/coldkeep
          CGO_ENABLED=1 go install ./cmd/coldkeep
          "$(go env GOPATH)/bin/coldkeep" version | grep -Fx 'coldkeep version 1.13.15'
          {
            echo "GO_VERSION=$(go version)"
            echo "GOTOOLCHAIN=$(go env GOTOOLCHAIN)"
            echo "GOOS=$(go env GOOS)"
            echo "GOARCH=$(go env GOARCH)"
            echo 'C_COMPILER<<EOF'
            cc --version
            echo 'EOF'
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Build and install from local source (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if ((go env GOVERSION) -ne 'go1.26.7') { throw 'Go version drift' }
          if ((go env GOTOOLCHAIN) -ne 'local') { throw 'GOTOOLCHAIN drift' }
          if (-not (Get-Command gcc -ErrorAction SilentlyContinue)) { throw 'native gcc is unavailable' }
          gcc --version
          $env:CGO_ENABLED = '1'
          go build ./cmd/coldkeep
          go install ./cmd/coldkeep
          $binary = Join-Path (go env GOPATH) 'bin/coldkeep.exe'
          if ((& $binary version) -ne 'coldkeep version 1.13.15') { throw 'binary identity mismatch' }
          "GO_VERSION=$(go version)" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          "GOTOOLCHAIN=$(go env GOTOOLCHAIN)" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          "GOOS=$(go env GOOS)" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          "GOARCH=$(go env GOARCH)" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          'C_COMPILER=gcc' | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append

  remote-candidate-install:
    name: Remote exact-candidate installation (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.7'
          check-latest: false
          cache: false

      - name: Install exact public candidate outside a module (Unix)
        if: runner.os != 'Windows'
        shell: bash
        env:
          CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -Eeuo pipefail
          test "$(go env GOVERSION)" = "go1.26.7"
          test "$(go env GOTOOLCHAIN)" = "local"
          cc --version

          install_root="$(mktemp -d "${RUNNER_TEMP}/coldkeep-remote-install.XXXXXX")"
          cd "${install_root}"
          export CGO_ENABLED=1
          export GOBIN="${install_root}/bin"
          export GOPROXY=direct
          export GOWORK=off

          module='github.com/franchoy/coldkeep'
          go list -m -json "${module}@${CANDIDATE_SHA}" > module.json
          resolved_hash="$(go list -m -f '{{with .Origin}}{{.Hash}}{{end}}' "${module}@${CANDIDATE_SHA}")"
          resolved_version="$(go list -m -f '{{.Version}}' "${module}@${CANDIDATE_SHA}")"
          test "${resolved_hash}" = "${CANDIDATE_SHA}"

          go install "${module}/cmd/coldkeep@${CANDIDATE_SHA}"
          "${GOBIN}/coldkeep" version | grep -Fx 'coldkeep version 1.13.15'
          go version -m "${GOBIN}/coldkeep" > binary-build-info.txt
          head -n 1 binary-build-info.txt | grep -E ': go1\.26\.7$'
          grep -F "$(printf 'mod\t%s\t%s' "${module}" "${resolved_version}")" binary-build-info.txt

          {
            echo "CANDIDATE_SHA=${CANDIDATE_SHA}"
            echo "RESOLVED_ORIGIN_HASH=${resolved_hash}"
            echo "RESOLVED_VERSION=${resolved_version}"
            echo "GO_VERSION=$(go version)"
            echo "GOTOOLCHAIN=$(go env GOTOOLCHAIN)"
            echo "GOOS=$(go env GOOS)"
            echo "GOARCH=$(go env GOARCH)"
            echo 'C_COMPILER<<EOF'
            cc --version
            echo 'EOF'
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Install exact public candidate outside a module (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if ((go env GOVERSION) -ne 'go1.26.7') { throw 'Go version drift' }
          if ((go env GOTOOLCHAIN) -ne 'local') { throw 'GOTOOLCHAIN drift' }
          if (-not (Get-Command gcc -ErrorAction SilentlyContinue)) { throw 'native gcc is unavailable' }
          gcc --version

          $installRoot = Join-Path $env:RUNNER_TEMP "coldkeep-remote-install-$env:CANDIDATE_SHA"
          New-Item -ItemType Directory -Force -Path $installRoot | Out-Null
          Set-Location $installRoot
          $env:CGO_ENABLED = '1'
          $env:GOBIN = Join-Path $installRoot 'bin'
          $env:GOPROXY = 'direct'
          $env:GOWORK = 'off'

          $module = 'github.com/franchoy/coldkeep'
          $moduleInfo = go list -m -json "$module@$env:CANDIDATE_SHA" | ConvertFrom-Json
          $moduleInfo | ConvertTo-Json -Depth 8 | Out-File -FilePath module.json -Encoding utf8
          if ($LASTEXITCODE -ne 0) { throw 'module resolution failed' }
          if ($moduleInfo.Origin.Hash -ne $env:CANDIDATE_SHA) { throw 'candidate origin mismatch' }

          go install "$module/cmd/coldkeep@$env:CANDIDATE_SHA"
          if ($LASTEXITCODE -ne 0) { throw 'remote candidate installation failed' }
          $binary = Join-Path $env:GOBIN 'coldkeep.exe'
          if ((& $binary version) -ne 'coldkeep version 1.13.15') { throw 'binary identity mismatch' }
          $buildInfo = go version -m $binary
          $buildInfo | Out-File -FilePath binary-build-info.txt -Encoding utf8
          if ($buildInfo[0] -notmatch ': go1\.26\.7$') { throw 'binary Go toolchain identity mismatch' }
          if (($buildInfo -join "`n") -notmatch [regex]::Escape("mod`t$module`t$($moduleInfo.Version)")) {
            throw 'installed module build identity mismatch'
          }

          "CANDIDATE_SHA=$env:CANDIDATE_SHA" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          "RESOLVED_ORIGIN_HASH=$($moduleInfo.Origin.Hash)" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          "RESOLVED_VERSION=$($moduleInfo.Version)" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          "GO_VERSION=$(go version)" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          "GOTOOLCHAIN=$(go env GOTOOLCHAIN)" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          "GOOS=$(go env GOOS)" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          "GOARCH=$(go env GOARCH)" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          'C_COMPILER=gcc' | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append

  product-container:
    name: Product container (linux/${{ matrix.arch }})
    runs-on: ubuntu-latest
    timeout-minutes: 25

    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
        with:
          platforms: arm64

      - name: Setup Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Validate pinned container contracts
        run: python3 scripts/validate_phase3_contracts.py

      - name: Build product image
        run: >-
          docker buildx build
          --platform linux/${{ matrix.arch }}
          --load
          --tag coldkeep:phase3-${{ matrix.arch }}
          .

      - name: Smoke product image
        run: >-
          docker run --rm
          --platform linux/${{ matrix.arch }}
          coldkeep:phase3-${{ matrix.arch }}
          version

  devcontainer:
    name: Development container contract
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate static development-container contract
        run: |
          python3 scripts/validate_phase3_contracts.py
          docker compose -f .devcontainer/docker-compose.yml config --quiet

      - name: Build and prove idempotent bootstrap
        shell: bash
        run: |
          set -Eeuo pipefail
          project='coldkeep-phase3'
          cleanup() {
            docker compose --project-name "$project" -f .devcontainer/docker-compose.yml down --volumes
          }
          trap cleanup EXIT
          docker compose --project-name "$project" -f .devcontainer/docker-compose.yml build workspace
          docker compose --project-name "$project" -f .devcontainer/docker-compose.yml up -d postgres workspace
          docker compose --project-name "$project" -f .devcontainer/docker-compose.yml exec -T workspace bash .devcontainer/post-create.sh
          docker compose --project-name "$project" -f .devcontainer/docker-compose.yml exec -T workspace bash .devcontainer/post-create.sh
          docker compose --project-name "$project" -f .devcontainer/docker-compose.yml exec -T workspace bash -lc 'test "$(go env GOVERSION)" = go1.26.7 && test "$(go env GOTOOLCHAIN)" = local && gcc --version'

  ci-required:
    name: CI Required Gate
    runs-on: ubuntu-latest
    needs: [quality, correctness-matrix, integration-stress, integration-long-run, adversarial, smoke, legacy-compatibility, benchmark-integrity, benchmark-timing-advisory, cross-platform, vulnerability, source-install, remote-candidate-install, product-container, devcontainer]
    if: ${{ always() }}
    timeout-minutes: 5
    steps:
      - name: Evaluate upstream jobs
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          CORRECTNESS_MATRIX_RESULT: ${{ needs['correctness-matrix'].result }}
          INTEGRATION_STRESS_RESULT: ${{ needs['integration-stress'].result }}
          INTEGRATION_LONG_RUN_RESULT: ${{ needs['integration-long-run'].result }}
          ADVERSARIAL_RESULT: ${{ needs.adversarial.result }}
          SMOKE_RESULT: ${{ needs.smoke.result }}
          LEGACY_COMPATIBILITY_RESULT: ${{ needs['legacy-compatibility'].result }}
          BENCHMARK_INTEGRITY_RESULT: ${{ needs['benchmark-integrity'].result }}
          BENCHMARK_TIMING_ADVISORY_RESULT: ${{ needs['benchmark-timing-advisory'].result }}
          CROSS_PLATFORM_RESULT: ${{ needs['cross-platform'].result }}
          VULNERABILITY_RESULT: ${{ needs.vulnerability.result }}
          SOURCE_INSTALL_RESULT: ${{ needs['source-install'].result }}
          REMOTE_CANDIDATE_INSTALL_RESULT: ${{ needs['remote-candidate-install'].result }}
          PRODUCT_CONTAINER_RESULT: ${{ needs['product-container'].result }}
          DEVCONTAINER_RESULT: ${{ needs.devcontainer.result }}
        run: |
          echo "quality=${QUALITY_RESULT}"
          echo "correctness-matrix=${CORRECTNESS_MATRIX_RESULT}"
          echo "integration-stress=${INTEGRATION_STRESS_RESULT}"
          echo "integration-long-run=${INTEGRATION_LONG_RUN_RESULT}"
          echo "adversarial=${ADVERSARIAL_RESULT}"
          echo "smoke=${SMOKE_RESULT}"
          echo "legacy-compatibility=${LEGACY_COMPATIBILITY_RESULT}"
          echo "benchmark-integrity=${BENCHMARK_INTEGRITY_RESULT}"
          echo "benchmark-timing-advisory=${BENCHMARK_TIMING_ADVISORY_RESULT}"
          echo "cross-platform=${CROSS_PLATFORM_RESULT}"
          echo "vulnerability=${VULNERABILITY_RESULT}"
          echo "source-install=${SOURCE_INSTALL_RESULT}"
          echo "remote-candidate-install=${REMOTE_CANDIDATE_INSTALL_RESULT}"
          echo "product-container=${PRODUCT_CONTAINER_RESULT}"
          echo "devcontainer=${DEVCONTAINER_RESULT}"

          if [ "${QUALITY_RESULT}" != "success" ] || \
             [ "${CORRECTNESS_MATRIX_RESULT}" != "success" ] || \
             [ "${INTEGRATION_STRESS_RESULT}" != "success" ] || \
             [ "${INTEGRATION_LONG_RUN_RESULT}" != "success" ] || \
             [ "${ADVERSARIAL_RESULT}" != "success" ] || \
             [ "${SMOKE_RESULT}" != "success" ] || \
             [ "${LEGACY_COMPATIBILITY_RESULT}" != "success" ] || \
             [ "${BENCHMARK_INTEGRITY_RESULT}" != "success" ] || \
             [ "${BENCHMARK_TIMING_ADVISORY_RESULT}" != "success" ] || \
             [ "${CROSS_PLATFORM_RESULT}" != "success" ] || \
             [ "${VULNERABILITY_RESULT}" != "success" ] || \
             [ "${SOURCE_INSTALL_RESULT}" != "success" ] || \
             [ "${REMOTE_CANDIDATE_INSTALL_RESULT}" != "success" ] || \
             [ "${PRODUCT_CONTAINER_RESULT}" != "success" ] || \
             [ "${DEVCONTAINER_RESULT}" != "success" ]; then
            echo "One or more required jobs failed or were skipped."
            exit 1
          fi
