name: CI

on:
  push:
    branches: [ main, "release/**", "hotfix/**" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ main ]
  merge_group:
    branches: [ main ]

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Clean test storage
        run: bash scripts/clean_test_storage.sh

      # Keep Go caching centralized in setup-go (cache: true); avoid adding a
      # second actions/cache layer for go-build or module paths unless measured.
      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.23'
          cache: true

      - name: Verify module
        run: go mod tidy && git diff --exit-code

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l $(git ls-files '*.go'))
          if [ -n "$unformatted" ]; then
            echo "Unformatted Go files detected:"
            echo "$unformatted"
            exit 1
          fi

      - name: Check smart quotes in Go files
        run: bash scripts/check_smart_quotes.sh

      - name: Check shell script syntax
        run: bash -n scripts/*.sh

      - name: Lint shell scripts (ShellCheck)
        uses: ludeeus/action-shellcheck@2.0.0
        with:
          scandir: ./scripts

      - name: Audit validation matrix coverage
        run: bash scripts/validate_validation_matrix.sh

      - name: Enforce versioned row writer scope
        run: bash scripts/check_versioned_row_writers.sh
          
      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.6.2
    
      - name: Vet
        run: go vet ./...

      - name: Test packages (plain codec)
        env:
          COLDKEEP_CODEC: plain
        run: go test -race -count=1 ./cmd/... ./internal/...

      - name: Test packages (aes-gcm codec)
        env:
          COLDKEEP_CODEC: aes-gcm
          COLDKEEP_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
        run: go test -race -count=1 ./cmd/... ./internal/...

      - name: Validate deterministic chunker benchmark tests (CI-fast)
        run: >-
          go test -race -count=1 ./internal/chunk/benchmark
          -run 'TestFastCDCBetterThanV1_SmallModifications|TestFastCDCBetterThanV1_ShiftedData|TestChunkerDeterminism|TestChunkerDeterminism_RunDatasetTwice|TestChunkCoverage|TestDefaultDatasetsDeterministicAcrossCalls'

      - name: Build packages
        run: go build ./...

      - name: Audit CI invariants (local)
        run: bash scripts/audit_ci_enforcement.sh --local-only

      - name: Build CLI
        run: go build -o coldkeep ./cmd/coldkeep

  correctness-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        codec: [plain, aes-gcm]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: coldkeep
          POSTGRES_PASSWORD: coldkeep
          POSTGRES_DB: coldkeep
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U coldkeep -d coldkeep"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Clean test storage
        run: bash scripts/clean_test_storage.sh

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.23'
          cache: true

      - name: Run integration tests (correctness tier)
        env:
          COLDKEEP_TEST_DB: 1
          COLDKEEP_DB_AUTO_BOOTSTRAP: true
          COLDKEEP_CODEC: ${{ matrix.codec }}
          COLDKEEP_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_USER: coldkeep
          DB_PASSWORD: coldkeep
          DB_NAME: coldkeep
          DB_SSLMODE: disable
        run: |
          set +e
          diag_dir="${RUNNER_TEMP}/integration-diag"
          mkdir -p "$diag_dir"
          json_file="$diag_dir/correctness-matrix-${{ matrix.codec }}.json"

          go test -race -count=1 -short -json ./tests/integration/... | tee "$json_file"
          status=${PIPESTATUS[0]}

          if [ "$status" -ne 0 ]; then
            echo "correctness-matrix failed for codec=${{ matrix.codec }}"
            first_test_fail=$(grep '"Action":"fail"' "$json_file" | grep '"Test":' | head -n 1 || true)
            first_package_fail=$(grep '"Action":"fail"' "$json_file" | head -n 1 || true)

            if [ -n "$first_test_fail" ]; then
              echo "first failing test event: $first_test_fail"
              fail_test_name=$(printf "%s\n" "$first_test_fail" | sed -n 's/.*"Test":"\([^"]*\)".*/\1/p')
              if [ -n "$fail_test_name" ]; then
                echo "first failing test name: $fail_test_name"
                preceding_run=$(awk -v test_field="\"Test\":\"$fail_test_name\"" 'index($0, "\"Action\":\"run\"") && index($0, test_field) {line=$0} END {print line}' "$json_file")
                if [ -n "$preceding_run" ]; then
                  echo "preceding run event: $preceding_run"
                fi
              fi
            elif [ -n "$first_package_fail" ]; then
              echo "first package-level fail event: $first_package_fail"
            else
              echo "no explicit fail event found in JSON output; printing tail for context"
            fi

            echo "package-level failure markers (first 20):"
            grep -E '"Output":".*(WARNING: DATA RACE|race detected during execution of test|panic:|fatal error:|signal:|FAIL\\t|FAIL\\n)' "$json_file" | head -n 20 || true

            echo "last 120 JSON lines:"
            tail -n 120 "$json_file" || true
          fi

          exit "$status"

      - name: Upload correctness-matrix diagnostic JSON
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: correctness-matrix-diag-${{ matrix.codec }}
          path: ${{ runner.temp }}/integration-diag/*.json
          if-no-files-found: ignore

      - name: Run Phase 7 snapshot retention lifecycle gate
        env:
          COLDKEEP_TEST_DB: 1
          COLDKEEP_DB_AUTO_BOOTSTRAP: true
          COLDKEEP_CODEC: ${{ matrix.codec }}
          COLDKEEP_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_USER: coldkeep
          DB_PASSWORD: coldkeep
          DB_NAME: coldkeep
          DB_SSLMODE: disable
        run: go test -race -count=1 ./tests/integration/... -run 'TestPhase7SnapshotRetentionLifecycleCLIIntegration'

  legacy-compatibility:
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: coldkeep
          POSTGRES_PASSWORD: coldkeep
          POSTGRES_DB: coldkeep
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U coldkeep -d coldkeep"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Clean test storage
        run: bash scripts/clean_test_storage.sh

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.23'
          cache: true

      - name: Run legacy compatibility regression tests
        env:
          COLDKEEP_TEST_DB: 1
          COLDKEEP_DB_AUTO_BOOTSTRAP: true
          COLDKEEP_CODEC: plain
          COLDKEEP_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_USER: coldkeep
          DB_PASSWORD: coldkeep
          DB_NAME: coldkeep
          DB_SSLMODE: disable
        run: go test -race -count=1 ./tests/integration/... -run 'TestPhase2PostMigrationStoreRestoreSnapshotRegressionIntegration'

  integration-stress:
    runs-on: ubuntu-latest
    needs: correctness-matrix
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        codec: [plain, aes-gcm]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: coldkeep
          POSTGRES_PASSWORD: coldkeep
          POSTGRES_DB: coldkeep
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U coldkeep -d coldkeep"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Clean test storage
        run: bash scripts/clean_test_storage.sh

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.23'
          cache: true

      - name: Run integration tests (standard stress tier)
        env:
          COLDKEEP_TEST_DB: 1
          COLDKEEP_DB_AUTO_BOOTSTRAP: true
          COLDKEEP_CODEC: ${{ matrix.codec }}
          COLDKEEP_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_USER: coldkeep
          DB_PASSWORD: coldkeep
          DB_NAME: coldkeep
          DB_SSLMODE: disable
        run: go test -race -count=1 ./tests/integration/...

  integration-long-run:
    runs-on: ubuntu-latest
    needs: integration-stress
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        codec: [plain, aes-gcm]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: coldkeep
          POSTGRES_PASSWORD: coldkeep
          POSTGRES_DB: coldkeep
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U coldkeep -d coldkeep"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Clean test storage
        run: bash scripts/clean_test_storage.sh

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.23'
          cache: true

      - name: Run dedicated long-run stability tests
        env:
          COLDKEEP_TEST_DB: 1
          COLDKEEP_LONG_RUN: 1
          COLDKEEP_DB_AUTO_BOOTSTRAP: true
          COLDKEEP_CODEC: ${{ matrix.codec }}
          COLDKEEP_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_USER: coldkeep
          DB_PASSWORD: coldkeep
          DB_NAME: coldkeep
          DB_SSLMODE: disable
        run: go test -race -count=1 ./tests/integration/... -run 'TestStoreGCVerifyRestoreDeleteLoopStability|TestRandomizedLongRunLifecycleSoak|TestSnapshotRetentionChurnLongRun'
  
  adversarial:
    runs-on: ubuntu-latest
    needs: integration-long-run
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        codec: [plain, aes-gcm]

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: coldkeep
          POSTGRES_PASSWORD: coldkeep
          POSTGRES_DB: coldkeep
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U coldkeep -d coldkeep"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Clean test storage
        run: bash scripts/clean_test_storage.sh

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.23'
          cache: true

      - name: Run adversarial validation (G1–G17)
        env:
          COLDKEEP_TEST_DB: 1
          COLDKEEP_LONG_RUN: 1
          COLDKEEP_DB_AUTO_BOOTSTRAP: true
          COLDKEEP_CODEC: ${{ matrix.codec }}
          COLDKEEP_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_USER: coldkeep
          DB_PASSWORD: coldkeep
          DB_NAME: coldkeep
          DB_SSLMODE: disable
        run: go test -race -count=1 ./tests/adversarial/...

      - name: Run Phase 7 snapshot-retention adversarial tests (G14–G17)
        env:
          COLDKEEP_TEST_DB: 1
          COLDKEEP_LONG_RUN: 1
          COLDKEEP_DB_AUTO_BOOTSTRAP: true
          COLDKEEP_CODEC: ${{ matrix.codec }}
          COLDKEEP_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_USER: coldkeep
          DB_PASSWORD: coldkeep
          DB_NAME: coldkeep
          DB_SSLMODE: disable
        run: go test -race -count=1 ./tests/adversarial/... -run 'TestAdversarialG14|TestAdversarialG15|TestAdversarialG16|TestAdversarialG17'

  smoke:
    runs-on: ubuntu-latest
    needs: [quality, correctness-matrix]
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        codec: [plain, aes-gcm]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: coldkeep
          POSTGRES_PASSWORD: coldkeep
          POSTGRES_DB: coldkeep
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U coldkeep -d coldkeep"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.23'
          cache: true

      - name: Build CLI
        run: go build -o coldkeep ./cmd/coldkeep

      - name: Run smoke script
        env:
          COLDKEEP_TEST_DB: 1
          COLDKEEP_CODEC: ${{ matrix.codec }}
          COLDKEEP_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_USER: coldkeep
          DB_PASSWORD: coldkeep
          DB_NAME: coldkeep
          DB_SSLMODE: disable
          COLDKEEP_STORAGE_DIR: ${{ github.workspace }}/.ci-storage/${{ matrix.codec }}
          COLDKEEP_SMOKE_RESET_DB: 1
          COLDKEEP_SMOKE_SCHEMA_MESSAGE_GATE: 1
        run: PATH="$PWD:$PATH" bash scripts/smoke.sh

      - name: Upload smoke artifacts on failure
        if: ${{ failure() }}
        uses: actions/upload-artifact@v5
        with:
          name: smoke-artifacts-${{ matrix.codec }}
          path: ${{ github.workspace }}/.ci-storage/${{ matrix.codec }}
          if-no-files-found: ignore

  benchmark-matrix:
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: coldkeep
          POSTGRES_PASSWORD: coldkeep
          POSTGRES_DB: coldkeep
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U coldkeep -d coldkeep"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    strategy:
      fail-fast: false
      matrix:
        compression: [none, zstd]

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.23'
          cache: true

      - name: Build CLI
        run: go build -o coldkeep ./cmd/coldkeep

      - name: Run benchmark (small dataset, workers=1) and capture output
        env:
          COLDKEEP_DB_AUTO_BOOTSTRAP: true
          COLDKEEP_CODEC: aes-gcm
          COLDKEEP_COMPRESSION: ${{ matrix.compression }}
          COLDKEEP_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
          COLDKEEP_CONTAINER_LOCK_RETRY_ATTEMPTS: 12
          COLDKEEP_CONTAINER_LOCK_RETRY_BASE_WAIT_MS: 15
          COLDKEEP_CONTAINER_LOCK_RETRY_MAX_WAIT_MS: 900
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_USER: coldkeep
          DB_PASSWORD: coldkeep
          DB_NAME: coldkeep
          DB_SSLMODE: disable
        run: ./coldkeep benchmark run --dataset small --workers 1 --output json | tee benchmark-${{ matrix.compression }}-w1.json

      - name: Run benchmark (small dataset, workers=4) and capture output
        env:
          COLDKEEP_DB_AUTO_BOOTSTRAP: true
          COLDKEEP_CODEC: aes-gcm
          COLDKEEP_COMPRESSION: ${{ matrix.compression }}
          COLDKEEP_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
          COLDKEEP_CONTAINER_LOCK_RETRY_ATTEMPTS: 12
          COLDKEEP_CONTAINER_LOCK_RETRY_BASE_WAIT_MS: 15
          COLDKEEP_CONTAINER_LOCK_RETRY_MAX_WAIT_MS: 900
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_USER: coldkeep
          DB_PASSWORD: coldkeep
          DB_NAME: coldkeep
          DB_SSLMODE: disable
        run: ./coldkeep benchmark run --dataset small --workers 4 --output json | tee benchmark-${{ matrix.compression }}-w4.json

      - name: Check regression (workers=1, uncompressed mode)
        if: matrix.compression == 'none'
        run: >-
          python3 scripts/validate_regression_thresholds.py check benchmark-none-w1.json
          --baseline benchmarks/v1.9/baselines/benchmark-baseline-v1.9-packed-aes-gcm-none-small-w1-r1.json
          --mode uncompressed
          --json-report regression-report-none-w1.json

      - name: Check regression (workers=1, compressed mode)
        if: matrix.compression == 'zstd'
        run: >-
          python3 scripts/validate_regression_thresholds.py check benchmark-zstd-w1.json
          --baseline benchmarks/v1.9/baselines/benchmark-baseline-v1.9-packed-aes-gcm-zstd-small-w1-r1.json
          --mode compressed
          --json-report regression-report-zstd-w1.json

      - name: Check regression (workers=4, uncompressed mode)
        if: matrix.compression == 'none'
        run: >-
          python3 scripts/validate_regression_thresholds.py check benchmark-none-w4.json
          --baseline benchmarks/v1.9/baselines/benchmark-baseline-v1.9-packed-aes-gcm-none-small-w4-r1.json
          --mode uncompressed
          --json-report regression-report-none-w4.json

      - name: Check regression (workers=4, compressed mode)
        if: matrix.compression == 'zstd'
        run: >-
          python3 scripts/validate_regression_thresholds.py check benchmark-zstd-w4.json
          --baseline benchmarks/v1.9/baselines/benchmark-baseline-v1.9-packed-aes-gcm-zstd-small-w4-r1.json
          --mode compressed
          --json-report regression-report-zstd-w4.json

      - name: Upload benchmark outputs
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: benchmark-matrix-${{ matrix.compression }}
          path: |
            benchmark-${{ matrix.compression }}-w1.json
            benchmark-${{ matrix.compression }}-w4.json
            regression-report-${{ matrix.compression }}-w1.json
            regression-report-${{ matrix.compression }}-w4.json
          if-no-files-found: ignore

  ci-required:
    name: CI Required Gate
    runs-on: ubuntu-latest
    needs: [quality, correctness-matrix, integration-stress, integration-long-run, adversarial, smoke, legacy-compatibility, benchmark-matrix]
    if: ${{ always() }}
    timeout-minutes: 5
    steps:
      - name: Evaluate upstream jobs
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          CORRECTNESS_MATRIX_RESULT: ${{ needs['correctness-matrix'].result }}
          INTEGRATION_STRESS_RESULT: ${{ needs['integration-stress'].result }}
          INTEGRATION_LONG_RUN_RESULT: ${{ needs['integration-long-run'].result }}
          ADVERSARIAL_RESULT: ${{ needs.adversarial.result }}
          SMOKE_RESULT: ${{ needs.smoke.result }}
          LEGACY_COMPATIBILITY_RESULT: ${{ needs['legacy-compatibility'].result }}
          BENCHMARK_RESULT: ${{ needs['benchmark-matrix'].result }}
        run: |
          echo "quality=${QUALITY_RESULT}"
          echo "correctness-matrix=${CORRECTNESS_MATRIX_RESULT}"
          echo "integration-stress=${INTEGRATION_STRESS_RESULT}"
          echo "integration-long-run=${INTEGRATION_LONG_RUN_RESULT}"
          echo "adversarial=${ADVERSARIAL_RESULT}"
          echo "smoke=${SMOKE_RESULT}"
          echo "legacy-compatibility=${LEGACY_COMPATIBILITY_RESULT}"
          echo "benchmark=${BENCHMARK_RESULT}"

          if [ "${QUALITY_RESULT}" != "success" ] || \
             [ "${CORRECTNESS_MATRIX_RESULT}" != "success" ] || \
             [ "${INTEGRATION_STRESS_RESULT}" != "success" ] || \
             [ "${INTEGRATION_LONG_RUN_RESULT}" != "success" ] || \
             [ "${ADVERSARIAL_RESULT}" != "success" ] || \
             [ "${SMOKE_RESULT}" != "success" ] || \
             [ "${LEGACY_COMPATIBILITY_RESULT}" != "success" ] || \
             [ "${BENCHMARK_RESULT}" != "success" ]; then
            echo "One or more required jobs failed or were skipped."
            exit 1
          fi
