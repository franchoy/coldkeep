name: CI

on:
  push:
    branches:
      - main
      - hotfix/**
      - release/**
    tags: [ "v*" ]
  pull_request:
    branches: [ main ]
  merge_group:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  GOTOOLCHAIN: local
  COLDKEEP_AES_GCM_FIXTURE_HEX: ${{ format('{0}{1}{0}{1}{0}{1}{0}{1}', '01234567', '89abcdef') }}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Test release-state validator
        run: python3 scripts/test_validate_release_state.py

      - name: Run complete Python validation suite
        run: python3 -m unittest discover -s scripts -p 'test_*.py' -v

      - name: Validate repository release state
        if: ${{ startsWith(github.ref, 'refs/heads/release/') || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'pull_request' && startsWith(github.head_ref, 'release/')) }}
        run: python3 scripts/validate_release_state.py --state auto

      - name: Clean test storage
        run: bash scripts/clean_test_storage.sh

      # Keep Go caching centralized in setup-go (cache: true); avoid adding a
      # second actions/cache layer for go-build or module paths unless measured.
      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.7'
          check-latest: false
          cache: true

      - name: Verify module
        run: go mod tidy && git diff --exit-code

      - name: Check formatting
        run: |
          mapfile -t go_files < <(git ls-files '*.go')
          unformatted=$(gofmt -l "${go_files[@]}")
          if [ -n "$unformatted" ]; then
            echo "Unformatted Go files detected:"
            echo "$unformatted"
            exit 1
          fi

      - name: Check smart quotes in Go files
        run: bash scripts/check_smart_quotes.sh

      - name: Check shell script syntax
        run: bash -n scripts/*.sh

      - name: Lint shell scripts (ShellCheck)
        uses: ludeeus/action-shellcheck@2.0.0
        with:
          scandir: ./scripts
          ignore_names: critical_coverage.sh

      - name: Audit validation matrix coverage
        run: bash scripts/validate_validation_matrix.sh

      - name: Enforce versioned row writer scope
        run: bash scripts/check_versioned_row_writers.sh

      - name: Test candidate lint gate contract
        run: go test -count=1 ./scripts -run '^TestCandidateLintGate'
          
      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.9.0
    
      - name: Vet
        run: go vet ./...

      - name: Test packages (plain codec)
        env:
          COLDKEEP_CODEC: plain
        run: go test -race -count=1 ./cmd/... ./internal/...

      - name: Test packages (aes-gcm codec)
        env:
          COLDKEEP_CODEC: aes-gcm
          COLDKEEP_KEY: ${{ env.COLDKEEP_AES_GCM_FIXTURE_HEX }}
        run: go test -race -count=1 ./cmd/... ./internal/...

      - name: Validate deterministic chunker benchmark tests (CI-fast)
        run: >-
          go test -race -count=1 ./internal/chunk/benchmark
          -run 'TestFastCDCBetterThanV1_SmallModifications|TestFastCDCBetterThanV1_ShiftedData|TestChunkerDeterminism|TestChunkerDeterminism_RunDatasetTwice|TestChunkCoverage|TestDefaultDatasetsDeterministicAcrossCalls'

      - name: Build packages
        run: go build ./...

      - name: Audit CI invariants (local)
        run: bash scripts/audit_ci_enforcement.sh --local-only

      - name: Build CLI
        run: go build -o coldkeep ./cmd/coldkeep

  correctness-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        codec: [plain, aes-gcm]
    services:
      postgres:
        image: postgres:16.15-bookworm@sha256:bb3e1a57e5407e0a5280b4211980a5e537f4abd234a87014ac979849a78dd825
        env:
          POSTGRES_USER: coldkeep
          POSTGRES_PASSWORD: coldkeep
          POSTGRES_DB: coldkeep
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U coldkeep -d coldkeep"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Clean test storage
        run: bash scripts/clean_test_storage.sh

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.7'
          check-latest: false
          cache: true

      - name: Run integration tests (correctness tier)
        env:
          COLDKEEP_TEST_DB: 1
          COLDKEEP_DB_AUTO_BOOTSTRAP: true
          COLDKEEP_CODEC: ${{ matrix.codec }}
          COLDKEEP_KEY: ${{ env.COLDKEEP_AES_GCM_FIXTURE_HEX }}
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_USER: coldkeep
          DB_PASSWORD: coldkeep
          DB_NAME: coldkeep
          DB_SSLMODE: disable
        run: |
          set +e
          diag_dir="${RUNNER_TEMP}/integration-diag"
          mkdir -p "$diag_dir"
          json_file="$diag_dir/correctness-matrix-${{ matrix.codec }}.json"

          go test -race -count=1 -short -json ./tests/integration/... | tee "$json_file"
          status=${PIPESTATUS[0]}

          if [ "$status" -eq 0 ]; then
          python3 - "$json_file" "${{ matrix.codec }}" <<'PY'
          import json
          import re
          import sys

          json_file, codec = sys.argv[1:]
          package = "github.com/franchoy/coldkeep/tests/integration"
          expected = [
              r"^TestRoundTripStoreRestore$",
          ]
          if codec == "plain":
              expected.extend([
                  r"^TestRemoveWithSharedChunksRefCount$",
                  r"^TestStartupRecoveryResyncsPreexistingQuarantinedOrphanConflictState$",
              ])

          events = []
          malformed = []
          try:
              with open(json_file, encoding="utf-8") as handle:
                  for line_number, raw_line in enumerate(handle, start=1):
                      try:
                          events.append(json.loads(raw_line))
                      except json.JSONDecodeError as exc:
                          malformed.append(f"line {line_number}: {exc}")
          except OSError as exc:
              print(f"required execution-proof failure: cannot read {json_file}: {exc}", file=sys.stderr)
              sys.exit(1)

          failures = []
          if not events:
              failures.append("JSON evidence file contained no events")
          if malformed:
              failures.append("malformed JSON evidence: " + "; ".join(malformed[:3]))

          package_events = [event for event in events if event.get("Package") == package]
          for pattern in expected:
              matching = [
                  event for event in package_events
                  if re.search(pattern, event.get("Test", ""))
              ]
              skipped = [event.get("Test", "") for event in matching if event.get("Action") == "skip"]
              passed = [event.get("Test", "") for event in matching if event.get("Action") == "pass"]
              if skipped:
                  failures.append(f"required test skipped: selector={pattern} tests={skipped}")
              if not passed:
                  failures.append(f"required pass missing: package={package} selector={pattern}")

          if failures:
              print("required execution-proof failure:", file=sys.stderr)
              for failure in failures:
                  print(f"- {failure}", file=sys.stderr)
              sys.exit(1)
          PY
            status=$?
          fi

          if [ "$status" -ne 0 ]; then
            echo "correctness-matrix failed for codec=${{ matrix.codec }}"
            first_test_fail=$(grep '"Action":"fail"' "$json_file" | grep '"Test":' | head -n 1 || true)
            first_package_fail=$(grep '"Action":"fail"' "$json_file" | head -n 1 || true)

            if [ -n "$first_test_fail" ]; then
              echo "first failing test event: $first_test_fail"
              fail_test_name=$(printf "%s\n" "$first_test_fail" | sed -n 's/.*"Test":"\([^"]*\)".*/\1/p')
              if [ -n "$fail_test_name" ]; then
                echo "first failing test name: $fail_test_name"
                preceding_run=$(awk -v test_field="\"Test\":\"$fail_test_name\"" 'index($0, "\"Action\":\"run\"") && index($0, test_field) {line=$0} END {print line}' "$json_file")
                if [ -n "$preceding_run" ]; then
                  echo "preceding run event: $preceding_run"
                fi
              fi
            elif [ -n "$first_package_fail" ]; then
              echo "first package-level fail event: $first_package_fail"
            else
              echo "no explicit fail event found in JSON output; printing tail for context"
            fi

            echo "package-level failure markers (first 20):"
            grep -E '"Output":".*(WARNING: DATA RACE|race detected during execution of test|panic:|fatal error:|signal:|FAIL\\t|FAIL\\n)' "$json_file" | head -n 20 || true

            echo "last 120 JSON lines:"
            tail -n 120 "$json_file" || true
          fi

          exit "$status"

      - name: Run required PostgreSQL internal package contracts
        if: ${{ matrix.codec == 'plain' }}
        env:
          COLDKEEP_TEST_DB: 1
          COLDKEEP_DB_AUTO_BOOTSTRAP: true
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_USER: coldkeep
          DB_PASSWORD: coldkeep
          DB_NAME: coldkeep
          DB_SSLMODE: disable
        run: |
          set -o pipefail
          output_file="${RUNNER_TEMP}/postgres-internal-contracts.json"

          go test -race -count=1 -json \
            ./internal/testutil/backendtest \
            ./internal/catalog \
            ./internal/db \
            ./internal/engine \
            ./internal/maintenance \
            ./internal/container \
            | tee "$output_file"

          python3 - "$output_file" <<'PY'
          import json
          import re
          import sys

          output_file = sys.argv[1]
          expected = {
              "github.com/franchoy/coldkeep/internal/testutil/backendtest": [
                  r"^TestForEachSQLiteFixture/postgres$",
              ],
              "github.com/franchoy/coldkeep/internal/catalog": [
                  r"^TestCatalogContractFindLogicalFileAcrossBackends/postgres$",
                  r"^TestCatalogContractFindPhysicalFilesAcrossBackends/postgres$",
                  r"^TestCatalogContractCurrentFileQueriesAcrossBackends/postgres$",
                  r"^TestCatalogContractRepositoryConfigurationAcrossBackends/postgres$",
                  r"^TestCatalogContractFindSnapshotAcrossBackends/postgres$",
                  r"^TestCatalogContractListSnapshotsAcrossBackends/postgres$",
                  r"^TestCatalogContractLoadReachabilityRootsAcrossBackends/postgres$",
                  r"^TestCatalogContractSnapshotGraphAcrossBackends/postgres$",
                  r"^TestCatalogContractGCPlansAcrossBackends/postgres$",
                  r"^TestCatalogContractChunkPlacementsAcrossBackends/postgres$",
                  r"^TestCatalogContractRestorePlansAcrossBackends/postgres$",
              ],
              "github.com/franchoy/coldkeep/internal/db": [
                  r"^TestEnsurePostgresSchemaAutoMigratesVersionElevenToTwelve$",
                  r"^TestSCH001AndSCH002BootstrapVersionAndIdempotency/postgres$",
                  r"^TestSCH003CurrentSchemaMetadata/postgres$",
                  r"^TestSCH004MinimalCatalogUsability/postgres$",
                  r"^TestSCH005CriticalUniqueness/postgres$",
                  r"^TestSCH006CriticalForeignKeys/postgres$",
                  r"^TestSCH007NullableAndDefaultSemantics/postgres$",
                  r"^TestSCH009PostgresVersionElevenAutoMigration/postgres$",
                  r"^TestSCH010AndSCH011MetadataBoundaries/postgres$",
                  r"^TestBackendTransactionCommitRollbackAcrossBackends/postgres$",
                  r"^TestBackendForUpdateLockReleaseAcrossBackends/postgres$",
                  r"^TestBackendNowaitAndSkipLockedAcrossBackends/postgres$",
                  r"^TestBackendBlockedLockCancellationAcrossBackends/postgres$",
                  r"^TestMutationRowsAffectedContractAcrossBackends/postgres$",
              ],
              "github.com/franchoy/coldkeep/internal/engine": [
                  r"^TestRemoveByIDPostgresPreservesSharedChunks$",
                  r"^TestEngineCurrentFilesAndConfigurationAcrossBackends/postgres$",
                  r"^TestEngineDoctorAcrossBackends/postgres$",
                  r"^TestEngineGarbageCollectionPlanAcrossBackends/postgres$",
                  r"^TestEngineStoreFolderAcrossBackends/postgres$",
                  r"^TestEngineReadStatsAndInspectAcrossBackends/postgres$",
                  r"^TestEngineReadSnapshotViewsAcrossBackends/postgres$",
                  r"^TestEngineReadVerifyAcrossBackends/postgres$",
                  r"^TestEngineReadContextAndErrorsAcrossBackends/postgres$",
                  r"^TestEngineSnapshotSelectorsAcrossBackends/postgres$",
                  r"^TestEngineSnapshotSelectorErrorsAcrossBackends/postgres$",
                  r"^TestEngineMutationStoreRemoveAcrossBackends/postgres$",
                  r"^TestEngineMutationSnapshotLifecycleAcrossBackends/postgres$",
                  r"^TestEngineMutationRestoreAcrossBackends/postgres$",
                  r"^TestEngineMutationErrorsAcrossBackends/postgres$",
                  r"^TestEngineGCDryRunAcrossBackends/postgres$",
                  r"^TestEngineRecoverAcrossBackendsAndIsIdempotent/postgres$",
                  r"^TestEngineRecoverFaultAndCancellationAcrossBackends/postgres$",
                  r"^TestEngineRepairAcrossBackends/postgres$",
                  r"^TestEngineRepairValidationOrderingAcrossBackends/postgres$",
                  r"^TestEngineRepairTypedBoundaryErrors/postgres$",
                  r"^TestEngineRepairFailFastOnInvariantViolation/postgres$",
              ],
              "github.com/franchoy/coldkeep/internal/maintenance": [
                  r"^TestGCAdvisoryLockUsesDedicatedSessionAndReleases$",
                  r"^TestRunGCReleasesAdvisoryLockAfterOperationFailure$",
                  r"^TestRunGCAdvisoryCleanupFailureReturnsErrorAndDiscardsSession$",
                  r"^TestRunGCLiveRefusesSingleConnectionPool$",
              ],
              "github.com/franchoy/coldkeep/internal/container": [
                  r"^TestContainerRowLockIntegrationAcrossBackends/postgres$",
              ],
          }

          raw_lines = []
          events = []
          malformed = []
          try:
              with open(output_file, encoding="utf-8") as handle:
                  for line_number, raw_line in enumerate(handle, start=1):
                      raw_lines.append(raw_line.rstrip("\n"))
                      try:
                          events.append(json.loads(raw_line))
                      except json.JSONDecodeError as exc:
                          malformed.append(f"line {line_number}: {exc}")
          except OSError as exc:
              print(f"PostgreSQL execution-proof failure: cannot read {output_file}: {exc}", file=sys.stderr)
              sys.exit(1)

          failures = []
          if not events:
              failures.append("JSON evidence file contained no events")
          if malformed:
              failures.append("malformed JSON evidence: " + "; ".join(malformed[:3]))

          observed = {}
          skipped = {}
          for event in events:
              package = event.get("Package", "")
              test = event.get("Test", "")
              action = event.get("Action", "")
              if package in expected and test:
                  if re.search("postgres", test, re.IGNORECASE):
                      observed.setdefault(package, []).append(f"{action}:{test}")
                  if action == "skip":
                      skipped.setdefault(package, []).append(test)

          for package, patterns in expected.items():
              package_events = [event for event in events if event.get("Package") == package]
              if not package_events:
                  failures.append(f"expected package produced no JSON events: {package}")
                  continue
              for pattern in patterns:
                  passes = [
                      event.get("Test", "") for event in package_events
                      if event.get("Action") == "pass" and re.search(pattern, event.get("Test", ""))
                  ]
                  if not passes:
                      failures.append(f"expected PostgreSQL pass missing: package={package} selector={pattern}")

          if failures:
              print("PostgreSQL execution-proof failure:", file=sys.stderr)
              for failure in failures:
                  print(f"- {failure}", file=sys.stderr)
              for package, patterns in expected.items():
                  print(f"expected package: {package}", file=sys.stderr)
                  print(f"expected selectors: {', '.join(patterns)}", file=sys.stderr)
                  print(f"observed PostgreSQL-related tests: {observed.get(package, [])}", file=sys.stderr)
                  print(f"skipped tests: {skipped.get(package, [])}", file=sys.stderr)
              print("last 80 JSON lines:", file=sys.stderr)
              for line in raw_lines[-80:]:
                  print(line, file=sys.stderr)
              sys.exit(1)
          PY

      - name: Upload correctness-matrix diagnostic JSON
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: correctness-matrix-diag-${{ matrix.codec }}
          path: ${{ runner.temp }}/integration-diag/*.json
          if-no-files-found: ignore

      - name: Run Phase 7 snapshot retention lifecycle gate
        env:
          COLDKEEP_TEST_DB: 1
          COLDKEEP_DB_AUTO_BOOTSTRAP: true
          COLDKEEP_CODEC: ${{ matrix.codec }}
          COLDKEEP_KEY: ${{ env.COLDKEEP_AES_GCM_FIXTURE_HEX }}
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_USER: coldkeep
          DB_PASSWORD: coldkeep
          DB_NAME: coldkeep
          DB_SSLMODE: disable
        run: go test -race -count=1 ./tests/integration/... -run 'TestPhase7SnapshotRetentionLifecycleCLIIntegration'

  legacy-compatibility:
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16.15-bookworm@sha256:bb3e1a57e5407e0a5280b4211980a5e537f4abd234a87014ac979849a78dd825
        env:
          POSTGRES_USER: coldkeep
          POSTGRES_PASSWORD: coldkeep
          POSTGRES_DB: coldkeep
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U coldkeep -d coldkeep"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Clean test storage
        run: bash scripts/clean_test_storage.sh

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.7'
          check-latest: false
          cache: true

      - name: Run legacy compatibility regression tests
        env:
          COLDKEEP_TEST_DB: 1
          COLDKEEP_DB_AUTO_BOOTSTRAP: true
          COLDKEEP_CODEC: plain
          COLDKEEP_KEY: ${{ env.COLDKEEP_AES_GCM_FIXTURE_HEX }}
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_USER: coldkeep
          DB_PASSWORD: coldkeep
          DB_NAME: coldkeep
          DB_SSLMODE: disable
        run: go test -race -count=1 ./tests/integration/... -run 'TestPhase2PostMigrationStoreRestoreSnapshotRegressionIntegration'

  integration-stress:
    runs-on: ubuntu-latest
    needs: correctness-matrix
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        codec: [plain, aes-gcm]
    services:
      postgres:
        image: postgres:16.15-bookworm@sha256:bb3e1a57e5407e0a5280b4211980a5e537f4abd234a87014ac979849a78dd825
        env:
          POSTGRES_USER: coldkeep
          POSTGRES_PASSWORD: coldkeep
          POSTGRES_DB: coldkeep
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U coldkeep -d coldkeep"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Clean test storage
        run: bash scripts/clean_test_storage.sh

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.7'
          check-latest: false
          cache: true

      - name: Run integration tests (standard stress tier)
        env:
          COLDKEEP_TEST_DB: 1
          COLDKEEP_DB_AUTO_BOOTSTRAP: true
          COLDKEEP_CODEC: ${{ matrix.codec }}
          COLDKEEP_KEY: ${{ env.COLDKEEP_AES_GCM_FIXTURE_HEX }}
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_USER: coldkeep
          DB_PASSWORD: coldkeep
          DB_NAME: coldkeep
          DB_SSLMODE: disable
        run: go test -race -count=1 ./tests/integration/...

  integration-long-run:
    runs-on: ubuntu-latest
    needs: integration-stress
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        codec: [plain, aes-gcm]
    services:
      postgres:
        image: postgres:16.15-bookworm@sha256:bb3e1a57e5407e0a5280b4211980a5e537f4abd234a87014ac979849a78dd825
        env:
          POSTGRES_USER: coldkeep
          POSTGRES_PASSWORD: coldkeep
          POSTGRES_DB: coldkeep
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U coldkeep -d coldkeep"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Clean test storage
        run: bash scripts/clean_test_storage.sh

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.7'
          check-latest: false
          cache: true

      - name: Run dedicated long-run stability tests
        env:
          COLDKEEP_TEST_DB: 1
          COLDKEEP_LONG_RUN: 1
          COLDKEEP_DB_AUTO_BOOTSTRAP: true
          COLDKEEP_CODEC: ${{ matrix.codec }}
          COLDKEEP_KEY: ${{ env.COLDKEEP_AES_GCM_FIXTURE_HEX }}
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_USER: coldkeep
          DB_PASSWORD: coldkeep
          DB_NAME: coldkeep
          DB_SSLMODE: disable
        run: go test -race -count=1 ./tests/integration/... -run 'TestStoreGCVerifyRestoreDeleteLoopStability|TestRandomizedLongRunLifecycleSoak|TestSnapshotRetentionChurnLongRun'
  
  adversarial:
    runs-on: ubuntu-latest
    needs: integration-long-run
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        codec: [plain, aes-gcm]

    services:
      postgres:
        image: postgres:16.15-bookworm@sha256:bb3e1a57e5407e0a5280b4211980a5e537f4abd234a87014ac979849a78dd825
        env:
          POSTGRES_USER: coldkeep
          POSTGRES_PASSWORD: coldkeep
          POSTGRES_DB: coldkeep
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U coldkeep -d coldkeep"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Clean test storage
        run: bash scripts/clean_test_storage.sh

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.7'
          check-latest: false
          cache: true

      - name: Run deterministic G6 PostgreSQL interleaving regression
        env:
          COLDKEEP_TEST_DB: 1
          COLDKEEP_DB_AUTO_BOOTSTRAP: true
          COLDKEEP_REQUIRE_DETERMINISTIC_G6_POSTGRES: 1
          COLDKEEP_REQUIRE_DETERMINISTIC_G6_RETRY_CASE: 1
          COLDKEEP_CODEC: ${{ matrix.codec }}
          COLDKEEP_KEY: ${{ env.COLDKEEP_AES_GCM_FIXTURE_HEX }}
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_USER: coldkeep
          DB_PASSWORD: coldkeep
          DB_NAME: coldkeep
          DB_SSLMODE: disable
        run: |
          go test -v -race -count=1 ./tests/adversarial/... \
            -run '^TestAdversarialG6DeterministicStoreInterleavingPostgres$'

      - name: Run adversarial validation (G1–G17)
        id: adversarial_g1_g17
        env:
          COLDKEEP_TEST_DB: 1
          COLDKEEP_LONG_RUN: 1
          COLDKEEP_DB_AUTO_BOOTSTRAP: true
          COLDKEEP_TEST_PRESERVE_FAILURE_STATE: "1"
          COLDKEEP_TEST_DIAGNOSTIC_DIR: ${{ runner.temp }}/adversarial-diag
          COLDKEEP_CODEC: ${{ matrix.codec }}
          COLDKEEP_KEY: ${{ env.COLDKEEP_AES_GCM_FIXTURE_HEX }}
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_USER: coldkeep
          DB_PASSWORD: coldkeep
          DB_NAME: coldkeep
          DB_SSLMODE: disable
        run: |
          set +e
          diag_dir="${RUNNER_TEMP}/adversarial-diag"
          mkdir -p "$diag_dir"
          log_file="$diag_dir/adversarial-${{ matrix.codec }}.log"
          echo "diag_dir=$diag_dir" >> "$GITHUB_OUTPUT"
          echo "log_file=$log_file" >> "$GITHUB_OUTPUT"

          go test -race -count=1 -json ./tests/adversarial/... 2>&1 | tee "$log_file"
          status=${PIPESTATUS[0]}

          if [ "$status" -eq 0 ]; then
          python3 - "$log_file" <<'PY'
          import json
          import re
          import sys

          log_file = sys.argv[1]
          package = "github.com/franchoy/coldkeep/tests/adversarial"
          expected = [
              r"^TestAdversarialG6IndependentProcessRepositoryContention/plain$",
              r"^TestAdversarialG6IndependentProcessRepositoryContention/aes-gcm$",
              r"^TestAdversarialG6KilledLeaseHolderReleasesRepository$",
              r"^TestAdversarialG6LiveGCExcludesIndependentStoreProcess$",
          ]

          events = []
          malformed = []
          try:
              with open(log_file, encoding="utf-8") as handle:
                  for line_number, raw_line in enumerate(handle, start=1):
                      try:
                          events.append(json.loads(raw_line))
                      except json.JSONDecodeError as exc:
                          malformed.append(f"line {line_number}: {exc}")
          except OSError as exc:
              print(f"required execution-proof failure: cannot read {log_file}: {exc}", file=sys.stderr)
              sys.exit(1)

          failures = []
          if not events:
              failures.append("JSON evidence file contained no events")
          if malformed:
              failures.append("malformed JSON evidence: " + "; ".join(malformed[:3]))

          package_events = [event for event in events if event.get("Package") == package]
          for pattern in expected:
              matching = [
                  event for event in package_events
                  if re.search(pattern, event.get("Test", ""))
              ]
              skipped = [event.get("Test", "") for event in matching if event.get("Action") == "skip"]
              passed = [event.get("Test", "") for event in matching if event.get("Action") == "pass"]
              if skipped:
                  failures.append(f"required test skipped: selector={pattern} tests={skipped}")
              if not passed:
                  failures.append(f"required pass missing: package={package} selector={pattern}")

          if failures:
              print("required execution-proof failure:", file=sys.stderr)
              for failure in failures:
                  print(f"- {failure}", file=sys.stderr)
              sys.exit(1)
          PY
            status=$?
          fi

          exit "$status"

      - name: Collect G6 failure diagnostics
        if: ${{ failure() && steps.adversarial_g1_g17.outcome == 'failure' }}
        continue-on-error: true
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_USER: coldkeep
          DB_PASSWORD: coldkeep
          DB_SSLMODE: disable
        run: |
          set +e
          diag_dir="${{ steps.adversarial_g1_g17.outputs.diag_dir }}"
          export diag_dir
          artifact_dir="${RUNNER_TEMP}/g6-failure-artifacts"
          mkdir -p "$artifact_dir/manifests" "$artifact_dir/db" "$artifact_dir/fs" "$artifact_dir/logs"

          if [ -n "$diag_dir" ] && [ -d "$diag_dir" ]; then
            cp -R "$diag_dir"/. "$artifact_dir/manifests/" 2>/dev/null || true
          fi

          python3 - <<'PY' > "${artifact_dir}/manifest-index.tsv"
          import glob
          import json
          import os

          diag_dir = os.environ.get("diag_dir", "")
          if not diag_dir or not os.path.isdir(diag_dir):
              raise SystemExit(0)

          seen = set()
          for path in sorted(glob.glob(os.path.join(diag_dir, "*.json"))):
              try:
                  with open(path, "r", encoding="utf-8") as fh:
                      payload = json.load(fh)
              except Exception:
                  continue

              db_name = payload.get("isolated_database_name") or payload.get("database_name") or ""
              temp_root = payload.get("preserved_temporary_root") or ""
              kind = payload.get("kind") or ""
              key = (db_name, temp_root, kind)
              if key in seen:
                  continue
              seen.add(key)
              print(f"{db_name}\t{temp_root}\t{kind}\t{os.path.basename(path)}")
          PY

          export PGPASSWORD="$DB_PASSWORD"
          collection_ok=1
          while IFS=$'\t' read -r db_name temp_root _kind _manifest_file; do
            if [ -n "$db_name" ]; then
              dump_path="${artifact_dir}/db/${db_name}.dump"
              if pg_dump -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$db_name" --format=custom --no-owner --no-privileges --file "$dump_path"; then
                echo "dumped preserved database $db_name to $dump_path"
                psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d postgres -c "SELECT pg_terminate_backend(pid) FROM pg_stat_activity WHERE datname = '${db_name}' AND pid <> pg_backend_pid();" >/dev/null 2>&1 || true
                psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d postgres -c "DROP DATABASE IF EXISTS \"${db_name}\";" >/dev/null 2>&1 || true
                echo "cleaned preserved database $db_name after dump"
              else
                echo "failed to dump preserved database $db_name" >&2
                collection_ok=0
              fi
            fi

            if [ -n "$temp_root" ] && [ -d "$temp_root" ]; then
              root_name="$(basename "$temp_root")"
              inventory_path="${artifact_dir}/fs/${root_name}.inventory.txt"
              archive_path="${artifact_dir}/fs/${root_name}.tar.gz"
              find "$temp_root" -printf '%M %u %g %s %TY-%Tm-%TdT%TT %p\n' | sort > "$inventory_path"
              if tar -C "$(dirname "$temp_root")" -czf "$archive_path" "$root_name"; then
                rm -rf "$temp_root"
                echo "cleaned preserved temp root $temp_root after archive"
              else
                echo "failed to archive preserved temp root $temp_root" >&2
                collection_ok=0
              fi
            fi
          done < "${artifact_dir}/manifest-index.tsv"

          log_file="${{ steps.adversarial_g1_g17.outputs.log_file }}"
          if [ -n "$log_file" ] && [ -f "$log_file" ]; then
            cp "$log_file" "$artifact_dir/logs/" || true
          fi

          if [ "$collection_ok" -ne 1 ]; then
            echo "one or more G6 diagnostic collection operations failed" >&2
            exit 1
          fi

      - name: Upload G6 failure diagnostics
        if: ${{ failure() && steps.adversarial_g1_g17.outcome == 'failure' }}
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: g6-failure-${{ matrix.codec }}-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/g6-failure-artifacts
          retention-days: 14
          if-no-files-found: ignore

      - name: Run Phase 7 snapshot-retention adversarial tests (G14–G17)
        env:
          COLDKEEP_TEST_DB: 1
          COLDKEEP_LONG_RUN: 1
          COLDKEEP_DB_AUTO_BOOTSTRAP: true
          COLDKEEP_CODEC: ${{ matrix.codec }}
          COLDKEEP_KEY: ${{ env.COLDKEEP_AES_GCM_FIXTURE_HEX }}
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_USER: coldkeep
          DB_PASSWORD: coldkeep
          DB_NAME: coldkeep
          DB_SSLMODE: disable
        run: go test -race -count=1 ./tests/adversarial/... -run 'TestAdversarialG14|TestAdversarialG15|TestAdversarialG16|TestAdversarialG17'

  smoke:
    runs-on: ubuntu-latest
    needs: [quality, correctness-matrix]
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        codec: [plain, aes-gcm]
    services:
      postgres:
        image: postgres:16.15-bookworm@sha256:bb3e1a57e5407e0a5280b4211980a5e537f4abd234a87014ac979849a78dd825
        env:
          POSTGRES_USER: coldkeep
          POSTGRES_PASSWORD: coldkeep
          POSTGRES_DB: coldkeep
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U coldkeep -d coldkeep"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.7'
